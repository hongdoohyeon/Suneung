<h3>1950년 10월 26일 14번</h3>
<p>한국사는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(3점, 46.7%)은 &#x27;우리 군대&#x27;에 대한 설명, 14번(44.1%)은 1950년 10월 26일 중국 인민 지원군의 참전 무렵을 다룬 빈칸, 10번(35.7%)은 가상 인터뷰 문항이었습니다.</p>
