<h2>2013년 10월 고3 학력평가 수학 A형 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>50% 넘은 문항 10개, 29·30번 80% 안팎</h3>
<p>수학 A형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 10개였습니다. 가장 많이 틀린 29번(4점, 80.7%)과 30번(79.5%)에 이어 객관식 21번(76.4%)이 응답의 26.5%가 한 오답에 몰리며 어려웠고, 28번(72.3%), 27번(66.1%)이 뒤를 이었습니다.</p>
