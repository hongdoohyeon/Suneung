<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 사상·문화에서 시작된 사건 18번</h3>
<p>세계사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 18번(3점, 45.5%)은 사상·문화 분야에서 시작된 사건의 시기에 있었던 사실을 묻는 문항, 16번(43.5%)은 우리 정부가 지난주 (가) 국가에서 한 일로 그 나라의 역사를 탐구하는 문항이었습니다.</p>
