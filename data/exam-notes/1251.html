<h3>호르몬 분비 조절 12번</h3>
<p>생명과학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 12번(3점, 67.5%)은 갑상샘 자극 호르몬 등 호르몬 A의 분비 조절 과정 문항으로 응답의 38.8%가 같은 오답(4번)을 골랐습니다. 2점짜리 4번(67.0%)은 감각 뉴런과 연합 뉴런을 구분하는 문항, 9번(61.8%)은 민말이집 신경 A, B의 흥분 전도 문항이었습니다.</p>
