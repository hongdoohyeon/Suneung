<h3>수도권 인구 순이동 20번, 69.8%</h3>
<p>오답률 50%를 넘은 문항은 20번(3점, 69.8%) 하나였습니다. 수도권 인구 순이동 그래프를 분석하는 문항으로 응답의 43.9%가 같은 오답(2번)을 골랐습니다. 15번(41.8%)은 시·도별 제조업 사업체 수와 생산액, 6번(41.4%)은 세 지역의 8월 기후 값 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
