<h3>위원회의 합의안 12번</h3>
<p>오답률 50%를 넘은 문항은 12번(3점, 53.2%) 하나였습니다. 한 위원회에서 발표한 합의안을 고르는 문항이었습니다. 6번(47.0%)은 교사의 질문에 대한 학생의 답변, 16번(44.0%)은 한 국제 정세가 성립했을 당시 각국의 상황 문항이었습니다.</p>
