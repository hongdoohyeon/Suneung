<h2>2016학년도 수능 화학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>화학Ⅰ은 표준점수 최고점 67점, 1등급 구분 표준점수 64점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 19번(3점, 63.2%)은 금속 A와 B가 든 비커에 C²⁺ 수용액의 부피를 달리해 넣은 산화 환원 실험, 20번(59.6%)은 기체 반응의 양적 관계 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>산화 환원 실험은 넣은 이온의 양에 따라 반응하는 금속이 바뀌는 단계를 구분해야 합니다.</p>
