<h2>2018학년도 6월 모의평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2018-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>윤리와 사상은 표준점수 최고점 72점, 1등급 구분 표준점수 69점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 8번(3점, 63.0%)은 사상가의 입장에서 빈칸의 진술을 고르는 문항, 11번(60.1%)은 두 한국 사상가의 가상 대화에서 적어도 한 사람이 긍정할 질문을 고르는 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>한국 유학자(이황·이이·정약용)의 사단칠정론과 인성론 차이를 표로 정리해 두면 효과적입니다.</p>
