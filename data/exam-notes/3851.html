<h3>다이오드·전구·코일 회로 13번</h3>
<p>오답률 50%를 넘은 문항은 2개였습니다. 가장 많이 틀린 13번(3점, 55.0%)은 p-n 접합 다이오드와 전구, 코일로 만든 회로, 20번(50.5%)은 받침대 위 직육면체 판의 양 끝에 물체를 올린 평형 문항이었습니다. 4번(45.3%)은 실로 연결된 세 물체의 등가속도 운동, 19번(40.0%)은 단면적이 일정한 관 속 이상 유체 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
