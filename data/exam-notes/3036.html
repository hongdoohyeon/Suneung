<h3>만점이어야 1등급, 충청 지방 도시 10번</h3>
<p>한국지리는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었습니다. 가장 많이 틀린 10번(3점, 51.6%)은 충청 지방의 도시 수 변화 자료, 18번(44.2%)은 1차 에너지 공급, 12번(43.1%)은 두 구의 용도 지역별 면적 비중 문항이었습니다.</p>
