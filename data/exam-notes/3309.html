<h2>2016학년도 수능 지구과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>지구과학Ⅱ는 표준점수 최고점과 1등급 구분 표준점수가 모두 64점이었고, 오답률 50%를 넘은 문항이 하나도 없었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 20번(3점, 49.3%)은 두 해령 부근의 고지자기 분포 문항, 19번(48.6%)은 높이에 따른 기온 분포와 공기 덩어리의 상승 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>만점이어야 1등급인 쉬운 시험이었습니다.</p>
