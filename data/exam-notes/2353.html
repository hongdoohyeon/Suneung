<h3>임칙서가 파견된 도시 15번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 15번(3점, 46.8%)은 공행과 임칙서를 힌트로 한 도시 퀴즈, 7번(43.2%)은 명이 왕퉁을 구원하려 대군을 보낸 상황의 왕조, 19번(42.8%)은 일본에서 중국으로 파견된 사절단의 이동 경로, 4번(42.4%)은 중국을 둘러싼 열강의 관계를 조정한 회의 문항이었습니다.</p>
