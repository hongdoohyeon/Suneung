<h3>대동법 13번 66.1%</h3>
<p>한국사는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 5개였습니다. 가장 많이 틀린 13번(2점, 66.1%)은 방납의 폐단을 막기 위해 실시한 수취 제도를 퀴즈 형식으로 묻는 문항으로 응답의 32.9%가 같은 오답을 골랐습니다.</p>
<p>우정국 개국 축하연을 이용한 정변 세력의 개혁 정강 15번(62.2%), 화약을 체결한 뒤 농민군의 활동 14번(52.9%)이 뒤를 이었습니다.</p>
