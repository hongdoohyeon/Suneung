<h3>지형 단면도 18번, 64.5%</h3>
<p>가장 많이 틀린 18번(3점, 64.5%)은 지도의 A~C에 해당하는 지형 단면도를 고르는 문항으로 응답의 32.6%가 한 오답에 몰렸습니다. 13번(50.8%)은 화산 지형 탐구 주제에 맞는 조사 지역을 고른 모둠을 찾는 문항, 10번(45.7%)은 금강·한강·낙동강을 구분하는 표 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
