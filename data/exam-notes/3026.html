<h3>1등급 46점, 반응 양적 관계 17번</h3>
<p>화학Ⅰ은 1등급 구분 원점수가 46점, 표준점수 최고점이 68점으로 쉬웠고 오답률 50%를 넘은 문항은 2개였습니다. 가장 많이 틀린 17번(3점, 68.0%)은 분자량이 다른 기체 A와 B가 반응해 C를 만드는 양적 관계, 20번(58.9%)은 A 이온 수용액의 부피와 금속 B의 질량을 달리한 산화 환원 실험 문항이었습니다.</p>
