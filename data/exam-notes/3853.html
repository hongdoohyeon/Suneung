<h2>2014년 4월 고3 학력평가 생명과학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>척수와 방광 9번, 50% 넘은 문항 없음</h3>
<p>생명과학Ⅰ은 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 9번(3점, 46.5%)은 척수와 방광 사이의 흥분 전달 경로, 19번(41.4%)은 철수네 가족의 유전병, 13번(41.0%)은 생태계 구성 요소 간의 관계, 20번(39.6%)은 방형구로 조사한 두 지역의 식물 분포 문항이었습니다.</p>
