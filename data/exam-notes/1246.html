<h3>힘-시간 그래프 20번</h3>
<p>통합과학은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 2개였습니다. 20번(3점, 63.4%)은 정지한 5 kg 물체에 수평 방향으로 작용한 힘의 크기를 시간에 따라 나타낸 그래프 문항, 14번(62.9%)은 고온 고밀도 광원의 빛을 분광기로 관찰해 방출 스펙트럼과 흡수 스펙트럼을 구분하는 문항이었습니다.</p>
