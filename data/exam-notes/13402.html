<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 14번(2점, 45.5%)은 자료와 관련된 지역을 지도에서 고르는 문항, 6번(37.3%)은 일본의 한 시대, 8번(36.8%)은 한 왕조의 문화 문항이었습니다.</p>
