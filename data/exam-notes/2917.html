<h3>금속 산화 환원 20번</h3>
<p>가장 많이 틀린 20번(3점, 65.5%)은 금속 A~C의 산화 환원 반응 실험, 19번(61.0%)은 1 g씩 완전 연소시켰을 때 생성되는 CO2의 질량이 같은 세 탄화수소, 17번(60.1%)은 A와 B의 몰수를 달리해 반응시키는 실험, 18번(58.2%)은 HCl, NaOH, KOH 혼합 용액 문항이었습니다.</p>
<p>오답률 50%를 넘은 문항은 8개, 1등급 구분 원점수는 42점이었습니다.</p>
