<h3>1등급 45점, 최고점 76점</h3>
<p>정치와 법은 입시기관이 집계한 1등급 구분 원점수가 45점, 표준점수 최고점이 76점이었습니다. EBSi 가채점 응답자의 문항별 오답률은 공개되지 않았습니다. 사회탐구 가운데 1등급 컷이 생활과 윤리(41점), 윤리와 사상(44점) 다음으로 낮아 어려운 편에 속했습니다.</p>
