<h3>풀이 순서와 善의 뜻</h3>
<p>한문은 문장에서 마지막으로 풀이되는 글자를 고르는 29번, 善이 같은 뜻으로 쓰인 한자어를 고르는 20번, 글의 내용으로 밑줄 친 표현의 의미를 고르는 24번, 글의 중심 내용과 관계있는 속담을 고르는 25번 등이 출제되었습니다.</p>
<h3>다의 한자 정리</h3>
<p>한문의 풀이 순서와 다의 한자(善, 能 등)의 쓰임을 예문과 함께 정리해 두면 좋습니다.</p>
