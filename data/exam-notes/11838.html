<h2>2013년 6월 고1 학력평가 영어 해설</h2>
<p class="exam__body-meta">2026-10-13 작성 · <a href="exam-set-kice-2013-jun-g1.html#review">이 회차 전체 해설 보기</a></p>
<h3>장문 빈칸 42번 71.2%</h3>
<p>영어는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 5개였습니다. 가장 많이 틀린 42번(3점, 71.2%)은 장문의 빈칸 문항이었습니다.</p>
<p>어린 시절 늘 어질러져 있던 내 방을 다룬 어법 27번(63.2%), 버빗원숭이가 포식자마다 다른 소리를 낸다는 동물 언어 글 34번(59.9%), 37번(58.4%)이 뒤를 이었습니다. 37번은 응답의 42.1%가 같은 오답(1번)을 골랐습니다.</p>
