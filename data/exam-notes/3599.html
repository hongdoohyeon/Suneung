<h3>추정 1등급 41점, 두 태풍 5번</h3>
<p>지구과학Ⅰ은 EBSi 추정 1등급 컷이 원점수 41점이었고 오답률 50%를 넘은 문항이 8개였습니다. 가장 많이 틀린 5번(3점, 63.7%)은 두 태풍의 이동 경로와 제주도 부근을 지날 때의 자료를 다룬 문항이었습니다.</p>
<p>어느 날 밤 관측한 카펠라와 북두칠성의 위치 17번(63.5%), 태양과 달의 적경·적위를 성도에 나타낸 16번(56.4%)이 뒤를 이었습니다.</p>
