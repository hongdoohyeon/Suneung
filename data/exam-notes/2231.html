<h3>세 교통수단의 특성 15번</h3>
<p>오답률 50%를 넘은 문항은 15번(3점, 58.4%) 하나였습니다. 세 교통수단의 특성을 그래프에서 고르는 문항이었습니다. 17번(49.6%)은 수도권 내 통근·통학 인구 표, 10번(48.4%)은 칼데라호 등 화산 지형, 12번(47.5%)은 1970년대 거점 개발 방식의 국토 종합 개발 계획 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
