<h3>27번이 30번보다 어려웠다</h3>
<p>수학 B형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 문항은 30번(66.0%)이 아니라 27번(4점, 71.2%)이었고, 29번(61.6%), 26번(52.6%)이 뒤를 이었습니다.</p>
