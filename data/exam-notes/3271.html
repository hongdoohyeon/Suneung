<h3>대통령의 주간 일정 6번</h3>
<p>오답률 50%를 넘은 문항은 6번(2점, 53.4%) 하나였습니다. 국무 회의 등 대통령의 주간 일정 ㉠~㉤으로 대통령의 권한을 묻는 문항이었습니다. 20번(45.0%)은 유권자 여론 조사, 7번(41.9%)은 위헌 법률 심판 제청 절차, 19번(40.3%)은 사례와 법적 판단 표 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
