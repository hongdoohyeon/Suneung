<h3>고대 동양 사상가의 편지 15번</h3>
<p>윤리와 사상은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 8개였습니다. 가장 많이 틀린 15번(2점, 71.0%)은 고대 동양 사상가가 쓴 가상 편지의 입장 문항, 10번(65.9%)은 중국 유교 사상가 갑, 을을 그림으로 탐구하는 문항, 17번(62.6%)은 &#x27;성장 그 자체가 유일한…&#x27;으로 시작하는 현대 서양 사상가 문항이었습니다.</p>
