<h2>2014년 4월 고3 학력평가 한국사 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 50% 넘은 문항 없음</h3>
<p>한국사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 7번(3점, 35.3%)은 탄원서로 조약을 묻는 문항, 12번(33.3%)은 윤관이 왕에게 아뢴 일의 시기, 19번(30.0%)은 단체 회원들 간의 논쟁으로 단체의 활동을 묻는 문항이었습니다.</p>
