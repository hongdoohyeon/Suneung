<h3>세대 간 계층 표 15번, 응답 41%가 한 오답에</h3>
<p>가장 많이 틀린 15번(3점, 73.1%)은 갑국의 세대 간 계층 구성 표로, 응답의 41.2%가 같은 오답(1번)을 골랐습니다. 20번(53.0%)은 가구 구성 표, 10번(51.1%)은 A국에서 들어온 차(茶) 문화의 변동 사례 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
