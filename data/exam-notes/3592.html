<h2>2015학년도 수능 물리학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2015-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>물리Ⅰ은 표준점수 최고점 72점, 1등급 구분 표준점수 68점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 18번(2점, 73.7%)은 빗면을 따라 운동하는 물체 문항, 20번(72.8%)은 평형을 유지하는 직육면체 나무 막대 네 개의 돌림힘 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>여러 막대가 쌓인 평형은 위쪽 막대부터 차례로 돌림힘 평형을 세우는 순서가 가장 확실합니다. 시험 전체 흐름은 이 회차의 회차 해설에 정리했습니다.</p>
