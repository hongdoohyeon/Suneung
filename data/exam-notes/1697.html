<h3>경제 지표 8번</h3>
<p>경제는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 8개였습니다. 가장 많이 틀린 8번(3점, 62.2%)은 갑국의 경제 지표 변화 표, 20번(60.6%)은 소비자 A~C가 X재를 1개씩 더 소비할 때의 표, 17번(59.8%)은 우리나라가 생산한 상품 A의 연도별 자료 문항이었습니다.</p>
