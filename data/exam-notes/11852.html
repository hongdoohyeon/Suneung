<h3>지형도 16번, 오답 쏠림 41.3%</h3>
<p>지리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 5개였습니다. 가장 많이 틀린 16번(3점, 67.7%)은 주변보다 높은 산지 지형의 설명에 맞는 지형도를 고르는 문항으로 응답의 41.3%가 같은 오답(2번)을 골랐습니다.</p>
<p>범람원 등 A~C 지형에 대한 설명 12번(59.5%), 지도에 표시된 두 산지의 상대적 특징을 그래프로 비교하는 11번(58.7%)이 뒤를 이었습니다.</p>
