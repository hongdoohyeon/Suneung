<h3>한 시기의 경제를 묻는 14번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 14번(3점, 44.4%)은 &#x27;하늘에는…&#x27;으로 시작하는 말로 시기를 정해 그 시기의 경제를 묻는 문항, 17번(33.5%)은 소련의 베를린 봉쇄 등 두 사건, 11번(30.8%)은 「마라의 죽음」 등 두 사건 사이를 묻는 문항이었습니다.</p>
