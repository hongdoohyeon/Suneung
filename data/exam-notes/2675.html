<h3>6·25 전쟁과 광저우 일구 무역</h3>
<p>가장 많이 틀린 13번(2점, 53.2%)은 유엔 안전 보장 이사회가 움직인 전쟁 시기의 사실, 8번(51.5%)은 서양 선박을 광저우로만 오게 한 조치 등 두 사건 사이를 묻는 문항이었습니다. 9번(50.7%)은 송의 운세가 기운 무렵 발표된 격문, 11번(50.4%)은 송에 신하의 예를 취한 나라 등 두 나라를 비교하는 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
