<h2>2014년 4월 고3 학력평가 생명과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 젖산과 아세트산 15번</h3>
<p>생명과학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었습니다. 오답률 50%를 넘은 문항은 피루브산이 젖산과 아세트산이 되는 과정을 다룬 15번(2점, 57.4%) 하나였고, 20번(49.0%)은 빛과 CO2 조건에 따른 광합성, 19번(40.2%)은 미토콘드리아의 반응과 저해 물질 문항이었습니다.</p>
