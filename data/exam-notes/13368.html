<h3>갑, 병의 법적 사실 10번</h3>
<p>가장 많이 틀린 10번(3점, 52.3%)은 갑, 병과 관련된 법적 사실, 12번(2점, 50.1%)은 국제 행위 주체를 채우는 문항이었습니다. 1번(46.0%)은 두 법 조항의 공통점으로 응답의 33.3%가 한 오답에 몰렸습니다. 법과 정치는 입시기관이 집계한 1등급 구분 원점수가 45점이었습니다.</p>
