<h3>일본어 공부를 묻는 대화 24번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 24번(2점, 75.4%)은 다카하시가 이 씨에게 일본어 공부가 어떤지 묻는 대화의 빈칸, 16번(74.3%)은 아침 일기 예보의 빈칸, 30번(73.1%)은 &#x27;遊んでばかり いられない&#x27; 같은 옳은 문장 표현, 19번(66.7%)은 신문사 기자의 전화 대화 문항이었습니다.</p>
