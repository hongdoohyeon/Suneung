<h3>세 유전병의 가계도 20번</h3>
<p>가장 많이 틀린 20번(3점, 69.7%)은 한 집안의 유전병 세 가지를 함께 다룬 가계 문항, 10번(66.6%)은 남자의 정소에서 일어나는 세포 분열, 15번(58.0%)은 철수 가족의 유전병, 5번(2점, 57.0%)은 단백질을 섭취했을 때 기관계의 통합적 작용 문항이었습니다.</p>
<p>오답률 50%를 넘은 문항은 8개, 1등급 구분 원점수는 41점이었습니다.</p>
