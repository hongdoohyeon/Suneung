<h3>공업의 입지 20번</h3>
<p>가장 많이 틀린 20번(3점, 60.7%)은 자료로 공업을 특정하고 원료 지향형 여부 등을 판단하는 문항, 15번(52.6%)은 권역별 도시 인구 규모에 따른 도시 수 변화 문항이었습니다. 17번(47.6%)은 세 지역을 지도에서 고르는 문항, 4번(45.0%)은 변성암·화성암·퇴적암 문항이었습니다.</p>
<p>1등급 구분 원점수는 48점이었습니다.</p>
