<h3>이자겸의 난 4번 66.7%</h3>
<p>한국사는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 3개였습니다. 가장 많이 틀린 4번(3점, 66.7%)은 이자겸이 군사를 일으킨 상황의 시기를 연표에서 고르는 문항으로 응답의 43.5%가 같은 오답(3번)을 골랐습니다. 15번(57.5%)은 9월 17일 총사령부 성립식을 거행한 군대, 19번(50.2%)은 누리 소통망 게시물로 &#x27;이 운동&#x27;을 묻는 문항이었습니다.</p>
