<h3>부분 일식 19번과 고대 이집트의 방위 20번</h3>
<p>오답률 50%를 넘은 문항은 19번(3점, 52.8%) 하나였습니다. 북반구 중위도에서 부분 일식이 일어난 날의 태양 문항이었습니다. 20번(48.2%)은 북위 30° 고대 이집트에서 동서남북과 절기를 알아내던 방법, 3번(45.5%)은 지구 환경에서의 탄소 순환 문항이었습니다.</p>
