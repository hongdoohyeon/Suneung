<h3>16~17세기 은 유통 7번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 7번(3점, 48.8%)은 16~17세기 동아시아의 은 유통 과정, 6번(39.7%)은 학회 발표로 묻는 혁명, 11번(38.6%)은 나가사키를 다룬 막부 문항이었습니다.</p>
