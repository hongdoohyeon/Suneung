<h3>노선 지질도 12번</h3>
<p>지구과학Ⅱ는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 12번(2점, 43.0%)은 노선 지질도, 10번(39.5%)은 남아메리카의 편각과 복각 분포, 19번(36.0%)은 수온-염분도 문항이었습니다.</p>
