<h3>출제 경향</h3>
<p>화학Ⅱ는 표준점수 최고점 72점, 1등급 구분 표준점수 68점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 20번(3점, 71.2%)은 기체 A의 분해 반응 평형 상수 문항, 18번(71.2%)은 반응 속도식 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>반응 속도식 문항은 반감기와 반응 차수의 관계를 먼저 판단하면 계산이 크게 줄어듭니다.</p>
