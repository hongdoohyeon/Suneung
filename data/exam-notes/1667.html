<h3>1등급 65점, 도시화 15번</h3>
<p>세계지리는 교육청 채점 결과 1등급 구분 표준점수는 65점, 최고점은 68점(159명)이었습니다. EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 3개였습니다.</p>
<p>15번(3점, 56.7%)은 세 국가의 도시 인구와 도시화율 변화 그래프, 6번(53.5%)은 &#x27;뾰족한 산봉우리&#x27;를 다룬 빙하 지형 대화, 2번(52.4%)은 두 지역의 기온·강수량 그래프로 식생 경관을 고르는 문항이었습니다.</p>
