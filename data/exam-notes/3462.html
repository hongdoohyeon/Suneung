<h3>세 사상가를 그림으로 16번</h3>
<p>오답률 50%를 넘은 문항은 16번(3점, 56.0%) 하나였습니다. 세 사상가의 입장을 그림으로 표현하는 문항이었습니다. 9번(48.5%)은 우주의 질서를 다룬 서양 사상가 갑이 을에게 제기할 비판, 17번(43.6%)은 국가를 최고의 공동체로 본 사상가 등 두 서양 사상가, 2번(42.0%)은 &#x27;자유 없이 사회주의는 없다&#x27;는 관점의 사상 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
