<h3>외교 형식 7번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 7번(3점, 41.7%)은 한 외교 형식에 대해 틀린 설명을 고르는 문항, 10번(38.4%)은 두 불상, 12번(36.2%)은 7세기 동아시아 형세 지도 문항이었습니다.</p>
