<h3>인권 선언과 새 헌법 사이 18번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 18번(3점, 40.4%)은 프랑스 혁명기 &#x27;인권 선언&#x27; 발표와 새 헌법 사이의 사실을 묻는 문항, 8번(40.1%)은 도다이사 대불전으로 시대를 묻는 문항, 13번(33.1%)은 관리 장영이 등장하는 화폐 제도를 시행한 왕조 문항이었습니다.</p>
