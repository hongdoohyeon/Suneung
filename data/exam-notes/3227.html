<h3>경사면 위 물체 20번</h3>
<p>오답률 50%를 넘은 문항은 2개였습니다. 가장 많이 틀린 20번(3점, 58.5%)은 경사면과 나란한 힘을 받는 물체가 실로 연결된 문항, 19번(50.9%)은 책상 위에서 45°로 던진 물체의 포물선 운동, 17번(49.7%)은 두 용수철에 연결된 물체의 단진동 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
