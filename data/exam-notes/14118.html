<h3>『후한서』 구절 배열 13번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 오답률이 50%였던 문항은 17번과 13번 두 개였습니다. 13번은 &#x27;禍發於細微&#x27;로 끝나는 『후한서』 구절의 앞부분을 &lt;보기&gt;의 카드로 순서대로 배열하는 문항, 17번은 의미상 ㉠과 바꾸어 쓸 수 있는 한자를 고르는 문항이었습니다.</p>
