<h3>이상 기체·추·액체의 평형 19번</h3>
<p>가장 많이 틀린 19번(3점, 62.2%)은 밀폐된 이상 기체와 추, 액체가 평형을 이룬 문항, 13번(2점, 53.2%)은 원자로 안에서 연속으로 일어나는 우라늄 핵분열 반응 문항으로 응답의 29.4%가 한 오답에 몰렸습니다. 18번(51.4%)은 서로 다른 액체 위에 뜬 용기의 부력, 6번(50.0%)은 접촉한 두 물체에 작용하는 힘 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
