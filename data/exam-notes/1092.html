<h3>빈칸 19번·6번과 그림 고르기 28번</h3>
<p>아랍어는 오답률 50%를 넘은 문항이 15개로 응답자 대부분이 어려워했습니다. 가장 많이 틀린 19번과 6번은 빈칸에 알맞은 말을, 21번은 글에 언급된 정보(직업·취미 등)를, 28번은 대화에서 설명하는 것에 해당하는 그림을 고르는 문항이었습니다.</p>
<h3>자기소개 어휘와 묘사 형용사</h3>
<p>자기소개에 쓰이는 기본 어휘와 사물을 묘사하는 형용사를 정확히 익혀 두는 것이 효과적입니다.</p>
