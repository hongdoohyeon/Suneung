<h3>1등급 44점, 최고점 79점</h3>
<p>물리학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 44점, 표준점수 최고점이 79점이었습니다. EBSi 가채점 응답자가 적어 문항별 오답률은 공개되지 않았습니다. 같은 회차 물리학Ⅰ(1등급 47점)보다 1등급 컷이 3점 낮아, Ⅱ과목 응시자에게도 쉽지 않은 시험이었습니다.</p>
