<h3>2013년 경제 활동 19번</h3>
<p>오답률 50%를 넘은 문항은 19번(3점, 51.3%) 하나였습니다. 갑국의 2013년 경제 활동을 분석하는 문항으로 응답의 29.9%가 한 오답에 몰렸습니다. 12번(48.7%)은 갑의 여유 자금 지출 현황, 8번(36.8%)은 경상 수지 변화 문항이었습니다.</p>
<p>1등급 구분 원점수는 48점이었습니다.</p>
