<h3>순차 이온화 에너지 17번</h3>
<p>화학Ⅰ은 EBSi 추정 1등급 컷이 원점수 43점이었고 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 17번(3점, 63.9%)은 2, 3주기 금속 원소의 제2~제4 이온화 에너지를 다룬 문항이었습니다.</p>
<p>기체 X와 산소의 반응 20번(60.3%), 금속 A~C의 산화 환원 반응 실험 19번(60.2%)이 뒤를 이었습니다.</p>
