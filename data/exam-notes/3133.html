<h3>정육면체 속 직육면체 20번</h3>
<p>가장 많이 틀린 20번(3점, 61.0%)은 한 변의 길이가 정해진 정육면체 내부에 직육면체가 들어 있는 구조를 다룬 문항, 11번(58.2%)은 일직선상에 고정된 세 점전하, 2번(52.0%)은 같은 타원 궤도를 도는 두 위성 문항으로 응답의 30.7%가 한 오답에 몰렸습니다.</p>
<p>오답률 50%를 넘은 문항은 5개, 1등급 구분 원점수는 44점이었습니다.</p>
