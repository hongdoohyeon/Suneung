<h3>최고점 76점, 최고점자 57명</h3>
<p>동아시아사는 교육청 채점 결과 1등급 구분 표준점수는 71점, 최고점은 76점(57명)이었습니다. EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 4개였습니다.</p>
<p>가장 많이 틀린 9번(3점, 59.4%)은 난징에서 베이징으로 천도하며 성과 궁전을 지은 왕조를 묻는 문항, 11번(56.2%)은 일본이 조선을 공격한 환란 시기의 출정을 다룬 자료의 시기를 연표에서 고르는 문항이었습니다.</p>
