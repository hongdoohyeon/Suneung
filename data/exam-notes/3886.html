<h3>철수네 가족의 유전병 19번, 78.0%</h3>
<p>가장 많이 틀린 19번(3점, 78.0%)은 철수네 가족의 유전병 문항으로 응답의 31.3%가 한 오답에 몰렸습니다. 18번(2점, 53.8%)은 AaBbDd인 두 개체의 교배, 13번(53.7%)은 음수림·지의류 등으로 본 천이 과정, 7번(2점, 51.8%)은 위에 연결된 두 신경 문항이었습니다.</p>
<p>1등급 구분 원점수는 42점이었습니다.</p>
