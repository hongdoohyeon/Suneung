<h3>오답률 50% 초과 문항이 없었던 한국지리</h3>
<p>한국지리는 EBSi 가채점 기준 오답률 50%를 넘은 문항이 없었습니다.</p>
<h3>경기·서울·인천의 인구 증감, 15번</h3>
<p>가장 많이 틀린 15번(3점, 44.8%)은 경기·서울·인천의 인구 자연적·사회적 증감 자료로 지역을 구별하는 문항이었습니다.</p>
<h3>수도권 인구 지표</h3>
<p>쉬운 회차에서는 수도권 지역별 인구 지표처럼 자주 나오는 자료형 문항을 실수 없이 푸는 것이 중요합니다.</p>
