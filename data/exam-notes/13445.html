<h3>서양 사상가의 ㉠ 15번, 응답 46%가 한 오답에</h3>
<p>오답률 50%를 넘은 문항은 15번(2점, 68.5%) 하나였습니다. 한 서양 사상가의 주장에서 ㉠에 대한 그의 견해를 고르는 문항으로, 응답의 46.0%가 같은 오답(5번)을 골랐습니다. 20번(49.9%)은 서술형 답안의 오류 찾기, 5번(49.9%)은 우리나라 사상 ㉠, ㉡ 문항이었습니다.</p>
