<h2>2013년 4월 고3 학력평가 화학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>50% 넘은 문항 8개, 기체 X~Z 18번 79.2%</h3>
<p>화학Ⅱ는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 8개로 이 회차 탐구에서 가장 많았습니다. 가장 많이 틀린 18번(3점, 79.2%)은 일정한 절대 온도에서 서로 반응하지 않는 기체 X~Z를 다룬 문항, 14번(66.2%)은 기체의 성질 실험, 20번(64.9%)은 이상 기체와 실제 기체 X 비교, 10번(61.4%)은 두 용액 자료 문항이었습니다.</p>
