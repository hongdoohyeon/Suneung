<h2>2017년 10월 고3 학력평가 지구과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2018-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 50% 넘은 문항 없음</h3>
<p>지구과학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고, 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 11번(3점, 48.8%)은 상공의 지균풍과 지표면의 지상풍, 19번(44.5%)은 엘니뇨 시기 태평양의 대기 순환과 남방 진동 지수, 16번(44.5%)은 수심과 파장에 따른 해파의 속력 문항이었습니다.</p>
