<h3>판 경계 8번과 바너드별 20번</h3>
<p>가장 많이 틀린 8번(3점, 63.4%)은 세 대륙판의 경계와 이동 속도 모식도 문항, 15번(59.5%)은 고도가 일정한 지역의 지질도, 13번(2점, 58.8%)은 우리나라 지체 구조와 어느 지질 시대의 대표 생물 문항이었습니다.</p>
<p>20번(55.7%)은 투명 종이에 배경 별을 그려 바너드별의 공간 운동을 분석하는 실험이었습니다. 1등급 구분 원점수는 41점이었습니다.</p>
