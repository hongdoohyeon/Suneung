<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>동아시아사는 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 66점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 19번(3점, 38.5%)은 중화민국 국민을 향한 선언문이 발표되던 무렵 동아시아 각 지역의 상황을 묻는 문항이었습니다.</p>
