<h2>2017년 4월 고3 학력평가 동아시아사 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2018-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>홍위병과 우창 봉기</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 9번(3점, 39.3%)은 강남 지역 중심의 물자 유통 그림으로 시기를 정하는 문항, 20번(38.1%)은 톈안먼 광장에 모인 홍위병으로 문화 대혁명을 묻는 문항, 8번(37.8%)은 우창 봉기로 시작된 신해혁명, 13번(36.0%)은 일본군의 진주만 공습 등 두 사건 사이를 묻는 문항이었습니다.</p>
