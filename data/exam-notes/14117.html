<h3>여격 구문 28번과 에르미타주 전시 20번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 28번(1점, 60.0%)은 세 문장의 빈칸 (a)~(c)에 들어갈 말을 고르는 문항, 20번(60.0%)은 소(小) 에르미타주에서 열린 전시 &#x27;신, 인간, 영웅&#x27; 안내문에 언급되지 않은 것을 고르는 문항, 25번(60.0%)은 공장에서 수리 중인 기계 수를 다룬 빈칸 문항이었습니다.</p>
