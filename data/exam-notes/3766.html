<h3>감자즙 카탈레이스 2번</h3>
<p>오답률 50%를 넘은 문항은 2번(3점, 59.9%) 하나였습니다. 감자즙에 든 카탈레이스의 활성에 영향을 주는 요인을 알아보는 실험이었습니다. 20번(40.8%)은 동물문의 특징 표, 19번(40.1%)은 폴리펩타이드를 암호화하는 DNA 주형 가닥 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
