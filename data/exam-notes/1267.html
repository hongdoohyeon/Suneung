<h3>구청 바자회 16번 75.1%</h3>
<p>사회·문화는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 16번(3점, 75.1%)은 ○○구청이 주관하는 바자회와 가입한 시민 단체 이야기를 나누는 대화로 사회 집단을 묻는 문항으로, 응답의 47.6%가 같은 오답(4번)을 골랐습니다. 17번(65.5%)은 학습 활동지 문항, 13번(62.5%)은 관료제와 탈관료제를 A, B로 둔 문항이었습니다.</p>
