<h2>2015학년도 수능 화학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2015-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>헬륨·네온 혼합 20번이 1위</h3>
<p>화학Ⅱ는 표준점수 최고점 68점, 1등급 구분 65점이었습니다.</p>
<h3>KNO₃ 포화 수용액의 농도, 10번</h3>
<p>가장 많이 틀린 20번(3점, 62.9%)은 헬륨과 네온 기체의 혼합 실험 문항, 10번(57.5%)은 두 온도에서 KNO₃ 포화 수용액의 퍼센트 농도와 몰랄 농도 문항이었습니다.</p>
<h3>돌턴의 부분 압력 법칙</h3>
<p>기체 혼합은 각 기체의 부분 압력이 몰 분율에 비례한다는 돌턴의 법칙으로 정리하면 단순해집니다.</p>
