<h2>2015년 4월 고3 학력평가 생명과학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음, 산불 뒤 2차 천이 18번</h3>
<p>생명과학Ⅰ은 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 18번(3점, 44.7%)은 산불이 난 뒤 식물 군집의 2차 천이 과정, 5번(42.9%)은 철수네 가족의 ABO식 혈액형 판정, 2번(42.0%)은 소화계와 다른 기관계 문항이었습니다.</p>
