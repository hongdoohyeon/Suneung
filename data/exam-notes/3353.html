<h3>진행하는 파동 10번, 70.9%</h3>
<p>가장 많이 틀린 10번(3점, 70.9%)은 진폭과 주기가 정해진 파동이 오른쪽으로 진행하는 한 순간을 다룬 문항으로 응답의 30.4%가 한 오답에 몰렸습니다. 20번(55.7%)은 비스듬히 던진 물체의 포물선 운동, 9번(54.4%)은 저항·코일·축전기를 연결한 교류 회로 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
