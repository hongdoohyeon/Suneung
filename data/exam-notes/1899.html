<h3>1등급 47점, 오답률 1위 20번</h3>
<p>오답률 50%를 넘은 문항은 20번(3점, 55.5%)과, 패전국 독일이 막대한 배상금을 요구받은 전쟁 중의 사실을 묻는 16번(52.9%) 두 개였습니다. 10번(47.9%)과 2번(47.1%)이 뒤를 이었고, 입시기관이 집계한 1등급 구분 원점수는 47점이었습니다.</p>
