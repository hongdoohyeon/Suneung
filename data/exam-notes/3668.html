<h3>세 사상가의 대답이 갈리는 7번</h3>
<p>가장 많이 틀린 7번(3점, 65.9%)은 갑·을은 긍정하고 병은 부정할 질문을 고르는 문항으로 응답의 44.8%가 같은 오답(3번)을 골랐습니다. 14번(53.3%)은 그림의 A~D에 들어갈 질문으로 응답의 36.7%가 한 오답에 몰렸고, 20번(50.1%)은 두 사상가의 입장을 그림으로 표현하는 문항이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
