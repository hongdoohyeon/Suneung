<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-sep-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>가격 규제 16번, 50% 넘은 문항 9개</h3>
<p>경제는 EBSi 추정 1등급 컷이 원점수 45점이었지만 오답률 50%를 넘은 문항이 9개였습니다. 가장 많이 틀린 16번(3점, 61.5%)은 정부가 X재 가격을 400원으로 규제하는 정책 문항이었습니다.</p>
<p>갑국의 실질 GDP와 인구수 변화 13번(60.0%), X재 생산의 외부 효과 6번(56.9%)이 뒤를 이었습니다. 상위 문항이 60% 안팎에 고르게 몰렸습니다.</p>
