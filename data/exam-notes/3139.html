<h3>1등급 41점, 원소 분석 실험 17번</h3>
<p>화학Ⅰ은 입시기관이 집계한 1등급 구분 원점수가 41점으로 1년 전 7월보다 4점 낮았습니다. 가장 많이 틀린 17번(3점, 62.5%)은 탄소 화합물의 원소 분석 실험, 20번(61.7%)은 기체 A와 B가 반응해 C를 만드는 실린더 실험, 18번(58.0%)은 HCl·NaOH·KOH 혼합 용액, 16번(58.0%)은 2·3주기 원소의 안정한 이온 문항이었습니다.</p>
