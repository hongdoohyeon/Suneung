<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2019-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 해안 지형 3번</h3>
<p>세계지리는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고, 오답률 50%를 넘은 문항은 없었습니다. 가장 많이 틀린 3번(3점, 47.3%)은 하천 침식곡에 바닷물이 들어와 형성된 해안 등 지도의 A~D 지형 문항, 15번(34.5%)은 1월과 7월의 강수 분포 지도, 19번(33.9%)은 한국을 여행 온 외국인들의 대화로 종교를 구분하는 문항이었습니다.</p>
