<h3>세 조약의 공통점 15번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(2점, 48.0%)은 조선국과 일본국의 조약 등 세 조약의 공통점, 18번(38.5%)은 한국과 관련된 두 조약, 16번(36.6%)은 16세기 이후 은 유통에 따른 변화 문항이었습니다.</p>
