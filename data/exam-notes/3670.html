<h2>2014년 10월 고3 학력평가 세계지리 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 훔볼트의 탐사 경로 13번</h3>
<p>세계지리는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 13번(3점, 42.8%)은 훔볼트의 남아메리카 탐사 경로를 나타낸 지도의 A~D 지역 문항, 18번(38.8%)은 대륙별 인구 순이동 변화 문항이었습니다.</p>
