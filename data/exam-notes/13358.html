<h3>50% 넘은 문항 6개, 30번 78.5%</h3>
<p>수학 B형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 30번(4점, 78.5%)에 이어 27번(69.6%), 객관식 19번(68.0%)과 21번(64.0%)이 어려웠습니다.</p>
