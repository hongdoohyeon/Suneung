<h2>2018학년도 9월 모의평가 지구과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2018-sept.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>지구과학Ⅱ는 1등급 구분 표준점수 67점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 19번(3점, 66.2%)은 북반구 해령 주변 암석의 고지자기로 해령의 이동을 알아보는 문항, 10번(58.1%)은 방해석의 광학적 성질 탐구 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>방해석의 복굴절처럼 광물의 광학적 성질은 편광 현미경 관찰 결과와 함께 정리해 두어야 합니다.</p>
