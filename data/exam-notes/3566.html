<h3>세 사상가를 그림으로 14번</h3>
<p>오답률 50%를 넘은 문항은 14번(3점, 65.3%) 하나였습니다. 세 사상가의 입장을 그림으로 표현하는 문항이었습니다. 7번(49.6%)은 세 입장을 그림으로 표현하는 문항으로 응답의 35.5%가 한 오답에 몰렸고, 5번(41.4%)은 국제 사회를 본질적으로 무정부 상태로 보는 입장 등 두 국제 관계관 문항이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
