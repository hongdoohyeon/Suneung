<h3>대학 축구부 기사 19번 74.5%</h3>
<p>사회·문화는 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 19번(3점, 74.5%)은 두 대학 축구부의 경기 기사 속 집단과 조직을 구분하는 문항이었습니다.</p>
<p>전체 문화와 하위문화, 반문화의 관계를 그림으로 나타낸 12번(59.3%), 협동 학습 프로그램이 학업 성취도에 미치는 영향을 다룬 연구 7번(59.3%), 문화의 공유성 검색 결과 4번(55.4%)이 뒤를 이었습니다.</p>
