<h2>2016학년도 수능 생명과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>생명과학Ⅱ는 표준점수 최고점 65점, 1등급 구분 표준점수 64점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 20번(3점, 69.4%)은 PCR 실험 문항, 18번(69.0%)은 750개 염기쌍 DNA의 복제·전사·번역 실험 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>PCR 문항은 프라이머가 결합하는 위치와 증폭 구간을 서열 위에 표시하며 푸는 연습이 필요합니다.</p>
