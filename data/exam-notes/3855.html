<h3>아이손 혜성 20번</h3>
<p>가장 많이 틀린 20번(2점, 63.0%)은 태양에 접근한 아이손 혜성을 다룬 신문 기사 문항으로 응답의 36.7%가 같은 오답(5번)을 골랐습니다. 19번(54.4%)은 조선 시대 천문도인 천상열차분야지도와 적도 좌표계, 17번(50.4%)은 서로 다른 날 관측한 달의 모습, 9번(48.5%)은 제주도 부근을 지나는 태풍 문항이었습니다.</p>
<p>1등급 구분 원점수는 43점이었습니다.</p>
