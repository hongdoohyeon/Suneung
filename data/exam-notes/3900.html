<h3>두 사상가를 그림으로 15번</h3>
<p>오답률 50%를 넘은 문항은 15번(3점, 67.4%) 하나였습니다. 두 사상가의 입장을 그림으로 표현하는 문항이었습니다. 20번(49.6%)은 국제 관계를 보는 두 입장, 14번(42.7%)은 수행 평가 답안의 오류 찾기, 12번(42.0%)은 신문 칼럼의 빈칸 문항이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
