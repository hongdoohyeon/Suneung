<h2>2017학년도 6월 모의평가 세계사 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>세계사는 표준점수 최고점 74점, 1등급 구분 표준점수 70점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 8번(2점, 54.8%)은 밑줄 친 황제에 대한 설명을 고르는 문항, 16번(48.7%)은 대화가 이루어진 시기를 연표에서 고르는 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>황제의 대내외 정책을 묻는 문항은 왕조별 대표 황제의 업적을 표로 정리해 두면 효과적입니다.</p>
