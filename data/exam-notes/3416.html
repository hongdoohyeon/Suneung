<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-sep-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>해안 지형 5번, 다큐멘터리 대본 17번</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 5개였습니다. 가장 많이 틀린 5번(2점, 69.8%)은 지도의 세 지형을 설명하는 문항, 17번(67.8%)은 다큐멘터리 방송 대본으로 지역의 특성을 묻는 문항이었습니다.</p>
<p>유럽계·아프리카계·아시아계·히스패닉 인구 구성 그래프 8번(59.9%), 형성 평가 답안 4번(55.9%)이 뒤를 이었습니다.</p>
