<h3>제도의 문제점을 해결하는 방안 15번</h3>
<p>한국사는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(3점, 41.3%)은 어느 제도 실시에 따른 문제점을 해결하기 위한 방안, 2번(33.5%)은 사료 학습의 빈칸, 16번(29.2%)은 토지 제도에 대한 가상 인터뷰 기사 문항이었습니다.</p>
