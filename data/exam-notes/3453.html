<h3>금속 C 이온과 금속 A, B 14번</h3>
<p>오답률 50%를 넘은 문항은 14번(3점, 60.1%) 하나였습니다. 금속 C 이온 수용액이 든 두 용기에 금속 A, B 분말을 넣는 산화 환원 문항이었습니다. 20번(45.6%)은 HCl과 NaOH을 30 mL씩 녹인 용액, 7번(45.4%)은 탄소 수 6개인 탄화수소 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
