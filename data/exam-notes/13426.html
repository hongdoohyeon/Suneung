<h3>『겐지 이야기』의 시대 16번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 14번(3점, 43.5%)은 신문 기사의 왕조, 6번(40.7%)은 인도를 다룬 잡지의 빈칸, 16번(39.0%)은 『겐지 이야기』가 나온 시대의 문화 문항이었습니다.</p>
