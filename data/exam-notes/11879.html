<h3>기체 확산 실험 11번 76.0%</h3>
<p>화학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 11번(3점, 76.0%)은 유리관이 달린 다공성 용기로 기체의 확산 속도를 알아보는 실험 문항이었습니다.</p>
<p>버드나무 껍질의 살리실산에서 출발한 의약품 개발 과정 17번(60.1%)은 응답의 41.1%가 같은 오답을 골랐고, 16번(56.0%), 2번(52.4%)이 뒤를 이었습니다.</p>
