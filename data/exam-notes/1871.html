<h3>야영장 대화 4번</h3>
<p>한국지리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 5개였습니다. 가장 많이 틀린 4번(3점, 61.9%)은 어느 야영장에서 나눈 대화의 ㉠~㉢ 문항, 2점짜리 8번(58.2%)은 A, B 지형의 공통된 형성 요인을 고르는 문항으로 응답의 35.0%가 같은 오답(2번)을 골랐습니다.</p>
