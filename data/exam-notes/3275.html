<h3>안락사를 둘러싼 1번</h3>
<p>가장 많이 틀린 4번(3점, 63.4%)은 세 사상가의 입장을 그림으로 탐구하는 문항으로 응답의 34.7%가 한 오답에 몰렸습니다. 1번(2점, 55.3%)은 안락사에 대한 두 입장을 다룬 첫 문항으로, 응답의 39.5%가 같은 오답(3번)을 골랐습니다.</p>
<p>20번(48.5%)은 세 사상가의 입장을 그림으로 표현하는 문항이었습니다. 1등급 구분 원점수는 42점이었습니다.</p>
