<h3>1등급 67점, 계층 구조 15번</h3>
<p>사회·문화는 교육청 채점 결과 1등급 구분 표준점수는 67점, 최고점은 70점(1,068명)이었습니다. 9월(1등급 69점, 최고점 73점)보다 쉬웠고, EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 3개였습니다.</p>
<p>가장 많이 틀린 15번(3점, 65.8%)은 갑국의 시기별 계층의 상대적 비율 그림 문항, 20번(56.0%)은 연령대별·성별 시간당 평균 임금 표 문항이었습니다.</p>
