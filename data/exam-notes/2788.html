<h3>만점이어야 1등급, 맞춤형 급여 10번</h3>
<p>사회·문화는 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 65점으로 만점이어야 1등급이었고, 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 10번(3점, 49.2%)은 빈곤 가구 가운데 맞춤형 급여를 받는 가구 비율, 20번(48.3%)은 부모와 자녀 세대의 계층 비율 문항이었습니다.</p>
