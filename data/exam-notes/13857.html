<h3>장애인 단체의 진정 8번 71.7%</h3>
<p>통합사회는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 8번(3점, 71.7%)은 장애인 단체가 국가인권위원회에 낸 진정 사례로 기본권 A의 특징에 옳게 답한 학생을 고르는 문항이었습니다. 5번(53.5%)은 중학교를 졸업한 16세 A가 편의점에서 일한 근로 사례 문항으로 응답의 32.9%가 같은 오답(5번)을 골랐습니다.</p>
