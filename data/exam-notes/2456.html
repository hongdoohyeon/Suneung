<h3>HCl, KOH, NaOH 중화 반응 20번</h3>
<p>가장 많이 틀린 20번(3점, 71.6%)은 HCl, KOH, NaOH을 차례로 섞는 중화 반응 실험으로 응답의 29.8%가 한 오답에 몰렸습니다. 18번(58.0%)은 탄화수소에서 H 원자 2개와 결합한 C 원자 수, 16번(57.2%)은 탄소와 질소를 중심 원자로 하는 분자, 19번(55.1%)은 금속의 산화 환원 반응 실험 문항이었습니다.</p>
<p>1등급 구분 원점수는 43점이었습니다.</p>
