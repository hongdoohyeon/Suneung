<h3>공연 안내문과 시각 계산</h3>
<p>러시아어는 공연 중 주의 사항을 담은 안내문 20번, 시각을 계산하는 대화 26번, 글의 내용으로 그림 속 인물을 찾는 25번, 대화 빈칸에 알맞지 않은 말을 고르는 18번 등이 출제되었습니다.</p>
<h3>시각 표현과 금지 표현</h3>
<p>시각·수사 표현과 안내문에 자주 나오는 금지 표현(нельзя 등)을 정리해 두는 것이 효과적입니다.</p>
