<h3>연령별 인구 비율 16번</h3>
<p>오답률 50%를 넘은 문항은 16번(3점, 58.7%) 하나였습니다. 15~64세 인구 비율 등 연령별 인구 구성을 다룬 그림 문항이었습니다. 20번(48.5%)은 갑과 을이 사는 나라의 자료, 12번(47.1%)은 우리나라 사회 보장 제도, 9번(43.1%)은 중세 도제를 예로 든 사회화 관점 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
