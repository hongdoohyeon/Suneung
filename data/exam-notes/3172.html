<p>가장 많이 틀린 18번(3점, 68.4%)은 유전자 x와 돌연변이 유전자 문항, 20번(58.9%)은 세포별 유전자 전사 조절 문항이었습니다.</p>
<h3>전사 인자와 조절 부위 표</h3>
