<h3>15세기 전반 서아시아 8번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 45점이었습니다. 가장 많이 틀린 8번(3점, 45.6%)은 15세기 전반 서아시아의 형세 지도, 11번(43.5%)은 화폐 속 인물 열전, 2번(38.7%)은 한 서적이 편찬된 시기의 유학 문항이었습니다.</p>
