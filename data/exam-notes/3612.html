<h2>2015학년도 수능 동아시아사 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2015-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>동아시아사는 표준점수 최고점 66점, 1등급 구분 표준점수 65점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 15번(2점, 70.4%)은 역대 왕조의 수도였던 도시에 대한 설명을 고르는 문항으로 응답의 50.2%가 한 오답에 몰렸고, 17번(51.2%)은 쑨원의 삼민주의를 언급한 두 문서를 비교하는 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>중국 역대 수도(장안·뤄양·카이펑·난징·베이징)는 왕조와 짝지어 정리해 두어야 합니다.</p>
