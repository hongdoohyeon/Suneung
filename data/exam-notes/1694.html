<h3>50% 넘은 문항 11개, 중화 반응 19번</h3>
<p>화학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 11개로 이 회차 탐구에서 세계사와 함께 가장 많았습니다. 가장 많이 틀린 19번(3점, 73.4%)은 HA와 BOH 수용액의 중화 반응 실험, 20번(72.3%)은 A(g)와 B(g)가 반응해 C(g)를 만드는 반응의 양적 관계 실험, 14번(68.6%)은 기체 X와 XY 계열 화합물 자료 문항이었습니다.</p>
