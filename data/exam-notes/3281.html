<h3>고대 서양 사상가의 반론 11번</h3>
<p>오답률 50%를 넘은 문항은 11번(2점, 50.8%) 하나였습니다. 고대 서양 사상가 을이 갑에게 제기할 반론을 고르는 문항이었습니다. 7번(44.0%)은 세 고대 동양 사상가의 상호 반론, 12번(42.6%)은 &#x27;천지는 장구하다&#x27;로 시작하는 사상가의 관점에서 퍼즐 낱말을 설명하는 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
