<h3>1등급 45점, 경상 수지 17번</h3>
<p>경제는 입시기관이 집계한 1등급 구분 원점수가 45점, 표준점수 최고점이 80점으로 사회탐구에서 가장 어려웠습니다. 가장 많이 틀린 17번(3점, 54.9%)은 갑국의 항목별 경상 수지 표, 11번(52.1%)은 GDP 디플레이터를 쓴 연도별 경제 지표 문항이었습니다.</p>
<p>10번(45.8%)은 X재 시장의 국내 수요와 공급, 20번(45.1%)은 두 나라의 생산비 문항이었습니다.</p>
