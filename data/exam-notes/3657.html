<h3>만점이어야 1등급, 두 점전하 11번</h3>
<p>물리학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었지만 오답률 50%를 넘은 문항도 3개 있었습니다. 가장 많이 틀린 11번(3점, 57.0%)은 원점에서 같은 거리에 고정된 두 점전하, 19번(53.2%)은 자기장 영역에 들어간 대전 입자, 10번(2점, 50.6%)은 물을 채운 기주 공명 실험 문항이었습니다.</p>
