<h3>얼음판 위 운동량 20번</h3>
<p>통합과학은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 2개였습니다. 20번(3점, 66.6%)은 수평한 얼음판에서 운동하는 두 선수 A, B의 운동량 문항, 10번(56.2%)은 원자가 생성되기 전과 후의 우주를 양성자·중성자·전자·빛으로 나타낸 모형 문항으로 응답의 35.9%가 같은 오답(5번)을 골랐습니다.</p>
