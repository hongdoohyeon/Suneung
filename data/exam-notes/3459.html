<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>생활과 윤리는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 9번(3점, 42.2%)은 세 입장을 그림으로 표현하는 문항, 7번(42.1%)은 악한 행위를 경계하는 사상의 수양 방법을 고르는 문항, 14번(40.5%)은 두 사상가를 그림으로 탐구하는 문항이었습니다.</p>
