<h3>예금과 현금 보유 18번</h3>
<p>경제는 오답률 50%를 넘은 문항이 없었지만 1등급 구분 원점수는 47점, 표준점수 최고점은 80점이었습니다. 가장 많이 틀린 18번(3점, 49.0%)은 연도별 금리와 물가로 예금과 현금 보유의 유불리를 따지는 문항, 12번(41.2%)은 같은 고용 통계를 두고 나눈 대화, 20번(38.2%)은 우리나라 기업의 해외 거래 문항이었습니다.</p>
