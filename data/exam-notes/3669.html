<h2>2014년 10월 고3 학력평가 세계사 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>세계사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 12번(3점, 33.1%)은 아메리카를 다룬 한 선언이 발표된 시기를 연표에서 고르는 문항, 3번(30.3%)은 자료의 상황이 전개되던 시기의 사실 문항이었습니다.</p>
