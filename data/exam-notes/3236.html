<h3>국회 입법 절차 6번</h3>
<p>법과 정치는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 6번(3점, 48.4%)은 국회 입법 절차 그림, 13번(48.0%)은 수사와 재판의 형사 절차, 14번(46.7%)은 범죄 성립 요건, 16번(45.8%)은 병원에서 근무하던 사람의 업무상 과실 사례 문항이었습니다.</p>
