<h3>탄산염 광물 5번</h3>
<p>지구과학Ⅱ는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 5번(2점, 48.0%)은 방해석 등 세 탄산염 광물의 쪼개짐과 화학식, 20번(43.3%)은 인접한 세 지역의 지층과 화석, 10번(43.0%)은 화강암의 용융 곡선과 변성 작용 조건 문항이었습니다.</p>
