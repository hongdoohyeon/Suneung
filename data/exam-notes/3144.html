<h3>세대 간 이동 20번과 최저 생계비 10번</h3>
<p>가장 많이 틀린 20번(3점, 63.4%)은 부모와 자녀 세대의 계층 자료 두 가지를 분석하는 문항, 10번(53.1%)은 갑국의 &#x27;중위 소득 대비 최저 생계비&#x27; 변화 표 문항이었습니다. 19번(37.7%)은 근대화를 바라보는 두 이론, 4번(32.5%)은 청소년의 공격 행동과 낚시 활동의 관계를 조사한 연구 문항이었습니다.</p>
