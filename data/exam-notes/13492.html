<h3>영화를 볼 수 없는 아들 21번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 21번(2점, 79.4%)은 아들이 그 영화를 볼 수 없는 이유를 말하는 대화의 빈칸, 29번(77.9%)은 &#x27;in den Regal&#x27; 같은 전치사와 관사의 격이 옳은 문장을 고르는 문항이었습니다.</p>
