<h3>수도권 두 지역 비교 7번</h3>
<p>한국지리는 입시기관이 집계한 1등급 구분 원점수가 43점이었습니다. 가장 많이 틀린 7번(3점, 64.4%)은 수도권의 A 지역에 비해 B 지역에서 높은 항목을 고르는 문항으로 응답의 45.4%가 같은 오답(3번)을 골랐습니다.</p>
<p>13번(58.6%)은 교통수단별 국내 화물 수송, 15번(57.8%)은 모둠별 실내 조사 보고서, 12번(48.1%)은 북한의 에너지 자원 문항이었습니다.</p>
