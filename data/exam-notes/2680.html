<h3>두 달의 기온·강수 차이 6번</h3>
<p>오답률 50%를 넘은 문항은 6번(3점, 66.2%) 하나였습니다. 지도의 세 지역에서 두 달의 평균 기온 차이와 강수량 차이로 지역을 고르는 문항이었습니다. 7번(48.0%)은 세 나라의 화석 에너지 소비량 변화, 15번(41.4%)은 두 이동 경로의 기후 자료, 10번(36.0%)은 잉카 트레일 등 안데스 지역 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
