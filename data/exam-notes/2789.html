<h3>시민 불복종을 정의한 현대 사상가 16번</h3>
<p>오답률 50%를 넘은 문항은 16번(3점, 67.3%) 하나였습니다. 법이나 정부 정책에 변화를 가져올 목적으로 행하는 시민 불복종을 정의한 현대 사상가의 입장을 고르는 문항이었습니다.</p>
<p>18번(47.6%)은 전쟁과 정의가 서로 반대 의미라는 견해를 다룬 사상가, 17번(41.6%)은 기업의 사회적 책임을 다룬 두 입장 문항이었습니다. 1등급 구분 원점수는 47점이었습니다.</p>
