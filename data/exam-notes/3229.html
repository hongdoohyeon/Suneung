<h3>만점이어야 1등급, 루벤의 실험 10번</h3>
<p>생명과학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었습니다. 가장 많이 틀린 10번(3점, 53.5%)은 루벤의 실험과 암실에 둔 식물의 광합성 속도 문항, 20번(53.2%)은 광합성 암반응 과정 문항이었습니다.</p>
<p>12번(48.1%)은 발아 중인 씨앗의 호흡률 측정 장치, 17번(46.1%)은 효소 X의 온도별 반응 속도 문항이었습니다.</p>
