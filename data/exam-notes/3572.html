<h2>2015년 3월 고3 학력평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-mar-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>윤리와 사상은 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 8번(3점, 47.4%)은 한 사상가가 갑, 을에게 공통으로 제기할 반론, 10번(45.3%)은 쾌락에 대한 사상가들의 입장을 그림으로 탐구하는 문항, 20번(43.7%)은 현대 사상을 다룬 서술형 답안의 오류 찾기 문항이었습니다.</p>
