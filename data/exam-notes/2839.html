<h2>2018학년도 6월 모의평가 사회·문화 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2018-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>사회·문화는 표준점수 최고점 71점, 1등급 구분 표준점수 66점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 15번(2점, 76.5%)은 과제를 적절하게 수행한 학생을 고르는 문항, 20번(71.5%)은 세대 간 계층 이동 자료 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>계층 이동 표는 행과 열의 합계를 먼저 확인하고, 비율을 실제 인원으로 바꿔 계산하는 습관이 필요합니다.</p>
