<h2>2016학년도 수능 생활과 윤리 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>생활과 윤리는 표준점수 최고점과 1등급 구분 표준점수가 모두 64점이었고, 오답률 50%를 넘은 문항이 없었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 19번(3점, 44.3%)과 15번(43.2%)은 모두 사상가들의 입장을 그림으로 탐구하는 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>만점이어야 1등급인 시험이었으므로 실수를 줄이는 것이 가장 중요했습니다.</p>
