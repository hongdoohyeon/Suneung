<h3>근대 서양 사상가 둘 9번</h3>
<p>오답률 50%를 넘은 문항은 2개였습니다. 가장 많이 틀린 9번(3점, 56.8%)은 두 근대 서양 사상가 문항으로 응답의 34.8%가 한 오답에 몰렸고, 13번(52.0%)은 검색 화면으로 소개한 사회사상가 A의 사상 문항이었습니다.</p>
