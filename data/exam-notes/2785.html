<h3>1등급 44점, 소득세 방식 9번</h3>
<p>경제는 입시기관이 집계한 1등급 구분 원점수가 44점, 표준점수 최고점이 83점으로 사회탐구에서 가장 어려웠습니다. 가장 많이 틀린 9번(3점, 55.6%)은 세율 적용 방식에 따른 소득세 제도 문항이었고, 20번·19번·17번(각 53.6%)은 두 나라의 생산비, X재와 Y재만 생산하는 나라의 GDP, 상품 수지 변화율 문항이었습니다.</p>
