<h3>라 마르세예즈로 묻은 18번</h3>
<p>오답률 50%를 넘은 문항은 18번(3점, 50.6%) 하나였습니다. 오스트리아에 선전 포고를 한 직후 만들어진 혁명가로 그 기구를 묻는 문항이었습니다. 10번(45.6%)은 자신이 인디오도 유럽인도 아니라고 한 인물의 말로 라틴 아메리카 독립을, 12번(34.9%)은 코페르니쿠스를 언급한 크리스티나 데 메디치에게 보낸 편지의 시기를 묻는 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
