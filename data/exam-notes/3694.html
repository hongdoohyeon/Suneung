<h3>추정 1등급 40점, 혈당량 조절 18번</h3>
<p>생명과학Ⅰ은 EBSi 추정 1등급 컷이 원점수 40점이었고 오답률 50%를 넘은 문항이 9개였습니다. 가장 많이 틀린 18번(2점, 73.0%)은 혈당량 조절에 관여하는 자율 신경과 운동 중 혈당 변화를 다룬 문항이었습니다.</p>
<p>무릎 반사의 흥분 전달 경로 8번(67.4%), G1기 세포에서 정자가 형성되는 과정 19번(63.5%)이 뒤를 이었습니다.</p>
