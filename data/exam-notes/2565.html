<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2019-mar-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>가계도 17번과 민말이집 신경 12번</h3>
<p>생명과학Ⅰ은 1등급 구분 원점수가 43점이었습니다. 가장 많이 틀린 17번(3점, 67.1%)은 두 유전 형질을 함께 다룬 가계 문항, 12번(64.1%)은 민말이집 신경 A, B의 지점별 막전위 변화 문항이었습니다.</p>
<p>13번(59.3%)은 영희네 가족의 유전병, 14번(2점, 54.8%)은 병원성을 약화시킨 백신과 혈청을 생쥐에게 주사하는 방어 작용 실험 문항이었습니다.</p>
