<h3>경기 침체 14번, 응답 47.5%가 같은 오답</h3>
<p>경제는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 14번 하나였습니다. 14번(2점, 61.2%)은 경제 성장률 전망치가 예상을 밑돌며 경기 침체 우려가 커진 갑국의 정책 ㉠, ㉡을 묻는 문항으로, 응답의 47.5%가 같은 오답(4번)을 골라 정답보다 그 오답을 고른 학생이 더 많았습니다. 나머지 문항은 모두 45% 이하였습니다.</p>
