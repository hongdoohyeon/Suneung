<h3>편광 현미경 10번</h3>
<p>지구과학Ⅱ는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 45점이었습니다. 가장 많이 틀린 10번(3점, 41.4%)은 직교 니콜 상태의 편광 현미경에서 재물대를 돌리며 본 광물, 20번(37.9%)은 현생 이언 생물 종류 수와 세 생물의 생존 시기, 8번(37.1%)은 두 화성암의 편광 현미경 사진 문항이었습니다.</p>
