<h3>교통수단과 표지판 문항</h3>
<p>아랍어는 오답률 50%를 넘은 문항이 15개로 응답자 대부분이 어려워했습니다. 가장 많이 틀린 23번은 빈칸에 알맞은 말을, 17번은 대화로 A가 이용할 교통수단(지하철)을, 27번은 글에서 설명하는 내용을 나타낸 그림을, 16번은 밑줄 친 부분에 해당하는 표지판을 고르는 문항이었습니다.</p>
<h3>생활 장면 어휘</h3>
<p>교통수단·표지판처럼 생활 장면에 자주 나오는 어휘를 그림과 함께 익혀 두는 것이 효과적입니다.</p>
