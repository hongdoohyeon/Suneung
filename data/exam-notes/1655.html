<h3>1등급 26.24%, 정부 형태 14번</h3>
<p>중학교 범위에서 출제된 사회는 1등급 비율이 26.24%(54,214명)였고, EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 2개였습니다.</p>
<p>14번(3점, 64.1%)은 갑국의 정부 형태가 전형적인 대통령제인지 의원 내각제인지 판단하는 문항, 15번(53.2%)은 시민 단체·이익 집단·정당을 구분하는 카드 탐구 활동 문항이었습니다.</p>
