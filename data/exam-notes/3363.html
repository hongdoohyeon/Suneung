<h3>만점이어야 1등급, 자녀 세대 비교 20번</h3>
<p>사회·문화는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었습니다. 오답률 50%를 넘은 문항은 A, B국의 자녀 세대를 분석하는 20번(3점, 57.0%) 하나였고, 14번(49.5%)은 A국의 인구 부양비 변화 표 문항이었습니다.</p>
