<h3>지열 발전 설비 지도 17번</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 17번(3점, 71.2%)은 국가별 발전 설비 용량 지도로 판의 경계부에서 개발 잠재력이 높은 신·재생 에너지를 찾는 문항이었습니다.</p>
<p>산호초·사빈·시 스택을 다룬 해안 지형 6번(65.9%), 두 영토 분쟁 지역을 비교한 19번(54.0%), 시리아·터키·독일 사이의 인구 이동 그림 20번(51.5%)이 뒤를 이었습니다.</p>
