<h3>2014년 10월 8일 개기 월식 19번</h3>
<p>가장 많이 틀린 19번(3점, 59.1%)은 그해 10월 8일 우리나라에서 볼 수 있을 개기 월식의 진행 과정을 다룬 문항, 16번(52.5%)은 두 외행성의 공전 궤도와 자전축 문항이었습니다. 3번(49.6%)은 페루 부근 해역의 수온 편차, 12번(44.2%)은 소행성 에로스와 혜성 문항이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
