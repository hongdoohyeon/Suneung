<h3>기후 특성 19번 72.5%</h3>
<p>한국지리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 19번(3점, 72.5%)은 세 지역의 기후 특성 그래프, 16번(70.7%)은 세 지역의 주요 제조업 출하액 비중, 6번(64.2%)은 학생이 쓴 여행기의 ㉠~㉣ 문항이었습니다.</p>
