<h2>2016년 7월 고3 학력평가 세계지리 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 50% 넘은 문항 없음</h3>
<p>세계지리는 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 67점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(3점, 35.4%)은 한 나라의 인종(민족) 구성 그래프, 17번(29.9%)은 신생대 제4기 해수면 변화, 19번(28.5%)은 지도의 분쟁 지역 A~D 문항이었습니다.</p>
