<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>물리학Ⅰ은 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 66점으로 만점이어야 1등급이었습니다. 오답률 50%를 넘은 문항은 19번(3점, 50.6%) 하나로 실로 연결한 두 물체의 운동 문항이었고, 20번(48.9%)은 공 P, Q가 받친 나무판의 평형, 18번(42.3%)은 깔때기에 공기를 불어 넣을 때 떠오르는 탁구공 문항이었습니다.</p>
