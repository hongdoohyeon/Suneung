<h2>2014년 10월 고3 학력평가 한국사 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, &#x27;헌정 21년&#x27;의 개헌 12번</h3>
<p>한국사는 1등급 구분 원점수가 50점, 표준점수 최고점이 64점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 12번(3점, 38.4%)은 &#x27;헌정 21년&#x27;을 언급한 개헌, 19번(32.4%)은 한 신문이 발행되던 시기의 모습, 13번(30.4%)은 태평양 전쟁 무렵 &#x27;우리 정부&#x27;의 상황 문항이었습니다.</p>
