<h3>50% 넘은 문항 11개, 탄산 칼슘 18번</h3>
<p>화학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 11개였습니다. 가장 많이 틀린 18번(3점, 77.0%)은 탄산 칼슘과 묽은 염산을 반응시키는 실험, 20번(72.8%)은 주사기로 수소 기체를 얻는 실험의 양적 관계, 7번(62.6%)은 소독용 알코올의 상품 정보 표시로 몰 농도를 구하는 문항이었습니다.</p>
