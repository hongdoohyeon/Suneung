<h3>송 태조의 문치주의 14번, 응답 47%가 한 오답에</h3>
<p>가장 많이 틀린 19번(3점, 60.7%)은 지도의 상황이 나타난 시기의 모습, 14번(57.9%)은 송 태조의 문치주의를 다룬 문항으로 응답의 47.0%가 같은 오답(1번)을 골랐습니다. 17번(30.1%)은 북베트남의 사이공 점령 등 두 사건 사이를 묻는 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
