<h2>2015년 7월 고3 학력평가 동아시아사 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>동아시아사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 18번(3점, 34.2%)은 일본의 항복 이후를 다룬 ㉠, ㉡ 문항, 15번(23.9%)은 태평천국 운동 등 두 개혁, 9번(23.4%)은 한·중 수교 등 두 수교 문항이었습니다.</p>
