<h3>여행기 속 기후 12번</h3>
<p>세계지리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 12번(2점, 68.5%)은 여행기 속 (가) 기후 지역의 특성으로 옳지 않은 것을 고르는 문항, 7번(65.9%)은 지도의 A~D 문항, 11번(57.3%)은 오랜 기간에 걸쳐 만들어진 대지형 (가)~(다)를 지도에서 고르는 문항이었습니다.</p>
