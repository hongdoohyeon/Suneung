<h3>실린더 속 He 실험 19번</h3>
<p>가장 많이 틀린 19번(3점, 64.6%)은 실린더에 He을 넣어 기체의 성질을 알아보는 실험, 16번(64.0%)은 1 m X 수용액에 X를 더 녹여 몰랄 농도를 두 배로 만드는 과정, 20번(60.1%)은 기체 X와 Y의 확산 속도 비교 실험, 17번(56.7%)은 엔탈피 변화와 결합 에너지 문항이었습니다.</p>
<p>오답률 50%를 넘은 문항은 6개, 1등급 구분 원점수는 44점이었습니다.</p>
