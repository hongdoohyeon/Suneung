<h3>고용 지표 뉴스 6번</h3>
<p>경제는 EBSi 추정 1등급 컷이 원점수 42점이었고 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 6번(3점, 69.9%)은 갑국의 경제 뉴스로 고용 지표를 분석하는 문항이었습니다.</p>
<p>갑국과 을국이 최대로 생산할 수 있는 양을 비교한 17번(64.5%), 우리나라 국제 수지표 20번(63.4%)이 뒤를 이었습니다.</p>
