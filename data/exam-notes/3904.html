<h3>두 화석 에너지의 국가별 소비량 17번</h3>
<p>오답률 50%를 넘은 문항은 17번(3점, 53.7%) 하나였습니다. 두 화석 에너지의 국가별 소비량 그래프 문항이었습니다. 20번(44.6%)은 A~C 국가에 대한 추론, 8번(44.5%)은 두 공업 지역, 14번(42.4%)은 인터넷 도서 검색 결과로 나라를 묻는 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
