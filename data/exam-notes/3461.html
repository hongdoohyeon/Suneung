<h2>2015년 7월 고3 학력평가 세계지리 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 9번(3점, 42.2%)은 한 시기 A~D 지역 주민의 생활 모습, 16번(38.1%)은 유럽 주요 축제가 열리는 두 지역의 기후, 12번(31.2%)은 맹그로브 해안 등 지도의 A~D 문항이었습니다.</p>
