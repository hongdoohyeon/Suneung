<h2>2025학년도 수능 한문Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2025-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 초과 13문항, 독해 문항에 몰린 오답</h3>
<p>2025학년도 수능 한문은 응답자 기준 오답률 50%를 넘은 문항이 13개로 까다로웠습니다. 오답률 상위 문항은 20~25번대에 몰렸는데, 글의 흐름과 구절의 의미를 파악하는 독해 문항에서 오답이 많았습니다.</p>
<h3>문장 구조부터 파악하기</h3>
<p>한문은 문장 구조(주어·서술어·목적어)를 먼저 파악한 뒤 글자의 뜻을 문맥에 맞게 정하는 연습이 독해 문항 대비에 가장 효과적입니다.</p>
