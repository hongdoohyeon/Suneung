<h3>만 18세 갑의 사례 8번, 70.5%</h3>
<p>가장 많이 틀린 8번(3점, 70.5%)은 만 18세 갑의 사례에서 ㉠~㉥을 판단하는 문항으로 응답의 41.9%가 같은 오답(2번)을 골랐습니다. 12번(55.4%)은 사례 분석, 16번(50.2%)은 두 기본권의 특징을 연결한 그림, 5번(49.4%)은 전형적인 두 정부 형태 비교 문항이었습니다.</p>
