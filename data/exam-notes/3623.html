<h2>2015학년도 수능 세계사 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2015-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>세계사는 표준점수 최고점 67점, 1등급 구분 표준점수 66점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 12번(2점, 67.1%)은 두 나라의 독립과 관련된 설명으로 옳지 않은 것을 고르는 문항, 4번(61.2%)은 인물이 활동하던 시기의 유럽 문화 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>독립 선언문 자료는 미국 독립 선언과 라틴 아메리카 독립 운동처럼 배경과 결과를 함께 정리해 두어야 합니다.</p>
