<h3>평가지 채점 20번</h3>
<p>오답률 50%를 넘은 문항은 20번(3점, 55.8%) 하나였습니다. 학생이 작성한 평가지의 ㉠~㉤ 가운데 정답을 옳게 쓴 것을 고르는 문항이었습니다. 19번(34.8%)은 네 지역 설명, 11번(33.0%)은 파랑의 침식으로 만들어진 지형 등 해안 지형 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
