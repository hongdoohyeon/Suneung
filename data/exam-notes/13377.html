<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>대폭발 우주론과 정상 우주론</h3>
<p>지구과학Ⅱ는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 10번(3점, 40.7%)은 북반구의 편동풍 파동, 18번(40.0%)은 케플러 회전을 하는 가상의 은하, 12번(40.0%)은 대폭발 우주론과 정상 우주론의 시간에 따른 변화 문항이었습니다.</p>
