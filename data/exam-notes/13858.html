<h3>판의 경계 18번 69.7%</h3>
<p>통합과학은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 3개였습니다. 가장 많이 틀린 18번(3점, 69.7%)은 동아프리카 열곡대·산안드레아스 단층·안데스산맥을 특징에 따라 구분하는 문항, 20번(56.4%)은 세포에서 일어나는 유전 정보의 흐름 문항이었습니다.</p>
