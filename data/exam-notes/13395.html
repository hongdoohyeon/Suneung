<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>34번 67.3%, 37번은 응답 45%가 한 오답에</h3>
<p>영어 B형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 34번(3점, 67.3%)에 이어 40번(65.6%), 37번(2점, 63.1%)이 어려웠고, 37번은 응답의 44.5%가 같은 오답(4번)을 골랐습니다.</p>
