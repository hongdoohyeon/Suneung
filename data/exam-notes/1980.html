<h3>홍수전의 반란 10번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 10번(3점, 56.1%)은 난징에서 홍수전을 부관참시하고 충왕을 처형했다는 기록으로 태평천국 운동을 묻는 문항이었습니다.</p>
<p>지폐 회자를 발행한 나라의 경제를 묻는 20번(52.4%), 산킨코타이로 에도에 반년째 머문 이의 일기로 에도 막부 시기를 묻는 14번(52.4%), 죽림칠현이 활동한 시기를 묻는 5번(51.3%)이 뒤를 이었습니다.</p>
