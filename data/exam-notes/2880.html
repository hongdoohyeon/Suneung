<h3>피스톤과 실로 연결된 물체 19번</h3>
<p>가장 많이 틀린 19번(3점, 70.8%)은 피스톤과 실로 연결된 물체의 평형, 9번(70.3%)은 길이가 다른 실로 막대에 연결되어 등속 원운동하는 두 물체, 15번(2점, 68.9%)은 이상 기체의 A→B→C→D→A 순환 과정, 18번(60.8%)은 길이가 다른 두 금속 막대의 열전도 문항이었습니다.</p>
<p>오답률 50%를 넘은 문항은 7개, 1등급 구분 원점수는 42점이었습니다.</p>
