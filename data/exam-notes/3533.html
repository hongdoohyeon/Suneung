<h3>고대 서양 사상가의 가상 대화 13번</h3>
<p>오답률 50%를 넘은 문항은 13번(3점, 52.9%) 하나였습니다. 두 고대 서양 사상가의 가상 대화 문항이었습니다. 19번(49.2%)은 두 사상가의 주장을 그림으로 표현하는 문항, 18번(44.5%)은 눈과 귀의 욕망을 다룬 동양 사상가 등 두 사상가, 14번(42.0%)은 조선 시대 두 사상가 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
