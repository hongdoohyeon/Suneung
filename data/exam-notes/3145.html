<h3>동의를 강조한 사상가 13번</h3>
<p>오답률 50%를 넘은 문항은 13번(3점, 58.9%) 하나였습니다. 당사자들의 동의를 강조한 사상가의 입장을 고르는 문항이었습니다. 19번(48.5%)은 두 사상가의 입장을 그림으로 표현하는 문항, 4번(34.8%)은 무질서로 고통받는 사회를 언급한 사상가 등 두 사상가의 해외 원조관 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
