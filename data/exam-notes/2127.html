<h3>1등급 35점, 구리·은 전지 15번</h3>
<p>화학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 35점, 표준점수 최고점이 92점으로 매우 어려웠고 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 15번(3점, 64.6%)은 구리와 은을 전극으로 한 화학 전지와 반쪽 반응의 표준 환원 전위를 다룬 문항으로 응답의 30.4%가 한 오답에 몰렸습니다.</p>
