<h2>2017년 11월 고2 학력평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-nov-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>50% 넘은 문항 7개, 배려 윤리 4번</h3>
<p>윤리와 사상은 오답률 50%를 넘은 문항이 7개였지만 모두 50%대였습니다. 가장 많이 틀린 11번(3점, 59.1%)과 9번(59.1%)은 사상가의 입장을 그림과 퍼즐로 탐구하는 문항이었습니다.</p>
<p>조선 시대 사상가의 가상 편지 19번(57.1%), 배려를 타자에 대한 공감과 수용으로 본 강연자의 주장을 고르는 4번(57.1%)이 뒤를 이었습니다.</p>
