<h3>1등급 72점, 메흐메트 2세 12번</h3>
<p>세계사는 교육청 채점 결과 1등급 구분 표준점수는 72점, 최고점은 74점(456명)이었습니다. 3월(1등급 71점, 최고점 78점)보다 최고점이 4점 내려갔고, EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 12번 하나였습니다.</p>
<p>12번(3점, 50.0%)은 베네치아 화가 젠틸레 벨리니가 그린 메흐메트 2세의 초상화로 그 제국을 묻는 문항이었습니다.</p>
