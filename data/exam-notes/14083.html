<h3>점심시간이 얼마나 되는지 묻는 26번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 26번(2점, 90.7%)은 점심시간이 얼마나 계속되는지 묻는 의문사의 빈칸, 24번(83.7%)은 극장에 가지 않은 이유를 말하는 대화, 10번(83.7%)은 러시아의 중요한 명절 가운데 하나를 고르는 문항, 12번(81.4%)은 학생들을 위한 2017년 한국어 학습 프로그램 글의 성격 문항이었습니다.</p>
