<h3>의료법 조항 9번</h3>
<p>가장 많이 틀린 20번(3점, 53.6%)은 세 사상가 가운데 적어도 한 명이 부정할 질문을 고르는 문항, 9번(2점, 53.2%)은 의료인의 비밀 누설 금지 등 우리나라 의료법 조항이 강조하는 내용을 묻는 문항이었습니다. 5번(48.9%)과 11번(48.6%)은 세 사상가의 입장을 그림으로 탐구하는 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
