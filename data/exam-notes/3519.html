<h3>용수철 진동 20번</h3>
<p>오답률 50%를 넘은 문항은 20번(3점, 57.0%) 하나였습니다. 용수철에 연결한 물체를 압축시켰다가 놓는 단진동 문항이었습니다. 4번(47.4%)은 수평으로 던진 물체, 19번(43.6%)은 피스톤이 연결된 두 실린더, 15번(41.7%)은 정육면체 상자 속 단원자 분자 이상 기체 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
