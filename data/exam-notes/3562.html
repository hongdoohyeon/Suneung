<h3>12세 초등학생의 사례 12번</h3>
<p>가장 많이 틀린 12번(3점, 63.9%)은 12세 초등학생이 친구를 다치게 한 사례의 법적 분석으로 응답의 35.8%가 한 오답에 몰렸습니다. 7번(2점, 61.2%)은 인종·종교·자원 등을 둘러싼 국제 분쟁을 다룬 학습 주제, 19번(54.2%)은 1998년 설립 근거가 마련된 국제 형사 재판소(ICC) 문항이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
