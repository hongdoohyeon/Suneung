<h3>만점이어야 1등급</h3>
<p>화학Ⅰ은 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 64점으로 만점이어야 1등급이었습니다. 오답률 50%를 넘은 문항은 금속 양이온 A, B 수용액에 금속 C를 넣는 20번(3점, 53.0%) 하나였고, 17번(48.6%)은 기체 반응의 양적 관계, 16번(32.8%)은 DNA 구조 문항이었습니다.</p>
