<h3>염화 나트륨 용융과 수용액 9번</h3>
<p>가장 많이 틀린 9번(2점, 60.2%)은 고체 염화 나트륨을 가열해 녹인 것과 물에 녹인 것을 비교하는 문항으로 응답의 37.5%가 한 오답에 몰렸습니다. 18번(52.3%)은 N·O·F·S·Cl을 구별하는 자료, 16번(52.2%)은 수소 원자의 전자 전이, 20번(52.0%)은 HA와 BOH의 중화 반응 실험이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
