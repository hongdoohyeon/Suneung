<h3>헌법 기관 A~C 6번</h3>
<p>가장 많이 틀린 6번(3점, 62.6%)은 국무위원 해임 건의 등으로 우리나라 헌법 기관 A~C를 구분하는 문항, 13번(59.1%)은 소년법상 소년 갑~정의 보호 처분 문항이었습니다. 15번(47.6%)은 갑국 의회 선거 결과, 4번(41.4%)은 A국 의회 선거 제도를 다룬 신문 기사 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
