<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2023-jun-g1.html#review">이 회차 전체 해설 보기</a></p>
<h3>카르스트 지형 11번만 50% 넘어</h3>
<p>통합사회는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 11번(3점, 54.1%) 하나였습니다. 중국 구이린과 베트남 할롱 베이를 사례로 카르스트 지형의 형성 과정을 묻는 문항으로 응답의 28.5%가 같은 오답(5번)을 골랐습니다.</p>
<p>권리 장전 등 인권 확장 과정에서 발표된 문서를 다룬 7번(46.6%)이 뒤를 이었고, 20문항 가운데 절반 이상이 오답률 20% 아래였습니다.</p>
