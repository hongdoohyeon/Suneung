<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>1등급 96점, 정사면체 30번 65.9%</h3>
<p>수학 B형은 입시기관이 집계한 1등급 구분 원점수가 96점, 표준점수 최고점이 133점으로 쉬웠고 오답률 50%를 넘은 문항은 3개였습니다. 가장 많이 틀린 30번(4점, 65.9%)은 좌표공간에서 정사면체 OPQR의 한 면이 축과 만나는 문항, 29번(63.7%)은 최고차항의 계수가 정해진 삼차함수로 만든 함수 문항, 28번(53.4%)이 그다음이었습니다.</p>
