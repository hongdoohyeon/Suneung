<h2>2016년 4월 고3 학력평가 한국지리 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 50% 넘은 문항 없음</h3>
<p>한국지리는 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 67점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 19번(2점, 39.8%)은 두 지역의 인구 구조, 5번(39.5%)은 조선 시대 산수화에 표현된 경관 사진, 13번(37.6%)은 한반도의 지각 운동 문항이었습니다.</p>
