<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-sep-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>강수량 분포 11번, 50% 넘은 문항 7개</h3>
<p>세계지리는 EBSi 추정 1등급 컷이 원점수 43점이었고 오답률 50%를 넘은 문항이 7개였지만 모두 60% 안팎이었습니다. 가장 많이 틀린 11번(3점, 60.4%)은 어느 시기의 강수량 분포 지도로 두 지역의 특징을 묻는 문항이었습니다.</p>
<p>두 지역의 상대적 특성 14번(59.7%), 세 기후가 나타나는 지역을 지도에서 고르는 5번(57.6%)이 뒤를 이었습니다.</p>
