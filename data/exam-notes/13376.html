<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>2012년 5월 21일 부분 일식 16번</h3>
<p>지구과학Ⅰ은 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 16번(3점, 44.1%)은 2012년 5월 21일 우리나라에서 관측한 부분 일식, 18번(35.9%)은 지구·금성·화성의 상대적 위치, 19번(30.5%)은 목성의 자기권과 오로라 문항이었습니다.</p>
