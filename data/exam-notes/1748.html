<h3>1등급 47점, 쉬웠던 물리학Ⅱ</h3>
<p>물리학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 47점, 표준점수 최고점이 73점으로 이 회차 과학탐구 가운데 쉬운 편이었습니다. EBSi 가채점 응답자가 적어 문항별 오답률은 공개되지 않았습니다. 응시자 대부분이 고득점을 받는 시험에서는 한 문항 실수가 등급을 가르므로, 평이한 문항의 계산 실수를 줄이는 쪽으로 점검하는 것이 좋습니다.</p>
