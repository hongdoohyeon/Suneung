<h3>추정 1등급 40점, 50% 넘은 문항 10개</h3>
<p>물리Ⅰ은 EBSi 추정 1등급 컷이 원점수 40점으로 이 회차 탐구에서 가장 낮았고 오답률 50%를 넘은 문항이 10개였습니다. 가장 많이 틀린 20번(3점, 67.1%)은 직선 도로에서 기준선 P를 지나는 자동차의 운동 문항이었습니다.</p>
<p>종이면에 수직으로 고정된 두 직선 도선 19번(61.7%), 변전소에서 같은 전력을 두 송전선으로 보내는 15번(61.2%)이 뒤를 이었습니다.</p>
