<h3>청·일 전쟁 뒤 일본령이 된 지역 20번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었지만 1등급 구분 원점수는 46점이었습니다. 가장 많이 틀린 20번(2점, 45.1%)은 청·일 전쟁 뒤 일본령이 된 지역을 지도에서 고르는 문항, 16번(37.8%)은 쑨원에게 질문하는 글의 빈칸, 8번(37.1%)은 미국에서 열린 군비 제한 회의의 시기 문항이었습니다.</p>
