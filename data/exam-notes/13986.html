<h3>12번 오답 쏠림 42.0%</h3>
<p>생활과 윤리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 12번(3점, 61.3%)은 사상가의 입장으로 옳은 것을 모두 고르는 문항으로 응답의 42.0%가 같은 오답(5번)을 골랐습니다. 15번(52.4%)은 갑, 을 사상가를 그림의 A~D로 탐구하는 문항, 19번(52.0%)은 갑 사상가가 &lt;사례&gt; 속 A에게 할 조언 문항이었습니다.</p>
