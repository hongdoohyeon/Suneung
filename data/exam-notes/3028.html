<h2>2016년 10월 고3 학력평가 경제 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>경제는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 19번(3점, 41.2%)은 갑~병국의 주요 경제 지표 변화, 17번(40.2%)은 세 나라 사이의 외화 이동, 9번(39.2%)은 X재 시장의 소비자와 생산자 의사 변화 문항이었습니다.</p>
