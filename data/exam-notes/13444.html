<h3>오답률 50% 넘은 문항 없음</h3>
<p>생활과 윤리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 16번(3점, 46.9%)은 한 사상의 수양 방법, 18번(42.8%)은 두 사상의 자연관, 3번(38.3%)은 한 관점에서 갑에게 줄 조언 문항이었습니다.</p>
