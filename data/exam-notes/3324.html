<h2>2016학년도 수능 사회·문화 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>사회·문화는 표준점수 최고점 67점, 1등급 구분 표준점수 64점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 15번(3점, 68.0%)은 우리나라 사회 보장 제도와 어느 시의 수급자 비율 자료 문항, 20번(63.1%)은 갑국의 계층 이동 자료 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>사회 보장 제도는 재원(보험료·세금)과 대상, 수혜 조건을 기준으로 구분해 두어야 합니다.</p>
