<h3>말만 하고 지키지 않는 아들, 16번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 16번(2점, 85.0%)은 매달 돈을 부쳐 준다던 아들이 지금까지 한 푼도 보내지 않았다는 대화의 빈칸 문항, 28번(80.0%)은 옳은 문장 표현을 고르는 문항, 11번(65.0%)은 생각이 금세 바뀐 상대에게 하는 말 문항이었습니다.</p>
