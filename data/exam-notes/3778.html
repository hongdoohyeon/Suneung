<h2>2014년 7월 고3 학력평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>윤리와 사상은 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(3점, 37.3%)은 쾌락을 다룬 사상가 등 세 서양 사상가, 13번(31.9%)은 &#x27;색(色)이 공(空)과 다르지 않다&#x27;는 사상 등 두 사상, 16번(31.7%)은 원초적 입장을 말한 서양 사상가 문항이었습니다.</p>
