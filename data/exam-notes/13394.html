<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>32번 72.2%, 50% 넘은 문항 9개</h3>
<p>영어 A형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 9개였습니다. 가장 많이 틀린 32번(3점, 72.2%)은 응답의 30.6%가 한 오답에 몰렸고, 34번(67.2%), 36번(66.8%), 31번(64.6%)이 뒤를 이었습니다. 듣기 13번(59.5%)도 오답률이 높았습니다.</p>
