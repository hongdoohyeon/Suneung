<h3>빈집에서의 대화 29번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 오답률 50%를 넘은 문항은 3개였습니다. 가장 많이 틀린 29번(2점, 56.4%)은 아무도 없는 것 같은 집을 찾아간 대화의 빈칸, 23번(54.5%)은 딸기를 사 온 가족의 대화에서 밑줄 친 말로 알 수 있는 것을 고르는 문항이었습니다.</p>
