<h2>2017학년도 6월 모의평가 경제 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>경제는 표준점수 최고점과 1등급 구분 표준점수가 모두 69점으로, 만점이어야 1등급이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 15번(3점, 51.3%)은 두 나라의 교역 전후 자료를 분석하는 문항, 19번(42.7%)은 환율 변화가 X재에 미치는 영향을 다룬 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>만점이어야 1등급인 시험에서는 비교 우위·환율처럼 자주 나오는 계산을 실수 없이 처리하는 것이 관건입니다.</p>
