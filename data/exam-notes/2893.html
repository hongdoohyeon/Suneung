<h3>판 경계로 나눈 지형 7번</h3>
<p>오답률 50%를 넘은 문항은 7번(3점, 56.5%) 하나였습니다. 지도의 A~C 지형을 구분하는 질문을 고르는 문항으로 응답의 30.9%가 한 오답에 몰렸습니다.</p>
<p>14번(48.0%)은 지도의 A~E 공업 지역, 20번(46.7%)은 미국으로의 시기별 인구 이동, 12번(43.2%)은 지역 경제 협력체 비교 문항이었습니다. 1등급 구분 원점수는 47점이었습니다.</p>
