<h3>온대 저기압 14번, 겨울철 일기도 20번</h3>
<p>지구과학Ⅰ은 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 14번(2점, 64.7%)은 북반구 온대 저기압 주변 세 지역의 날씨를 비교하는 문항, 20번(63.0%)은 겨울철 어느 날 우리나라 주변의 지상 일기도와 가시광선 위성 영상 문항이었습니다.</p>
<p>북한산 인수봉의 판상 절리와 제주도 해안의 주상 절리를 비교한 5번(53.6%)이 뒤를 이었습니다.</p>
