<h2>2021년 11월 고1 학력평가 통합사회 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2021-nov-g1.html#review">이 회차 전체 해설 보기</a></p>
<h3>선거권 제한 2번, 인권 3세대론 19번</h3>
<p>통합사회는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 3개였습니다. 2번(3점, 59.0%)은 집행 유예 중이라는 이유로 선거권을 제한한 법을 다투는 갑의 사례로 기본권 A, B를 묻는 문항, 19번(54.3%)은 카렐 바작의 인권 3세대론 표 문항, 8번(50.2%)은 환불이나 재판매가 안 되는 해외 패키지 여행 상품을 예매한 갑의 선택 문항이었습니다.</p>
