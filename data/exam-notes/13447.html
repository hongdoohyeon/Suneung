<h3>소매 업태 9번, 응답 43%가 한 오답에</h3>
<p>가장 많이 틀린 9번(2점, 65.8%)은 ㉠~㉢에 들어갈 소매 업태를 그래프에서 고르는 문항으로 응답의 42.9%가 같은 오답(2번)을 골랐습니다. 11번(57.7%)은 교통수단 A~E의 특성 비교, 7번(49.0%)은 세 지역의 기온과 강수 편차 문항이었습니다.</p>
