<h3>RLC 교류 회로 15번</h3>
<p>오답률 50%를 넘은 문항은 2개였습니다. 가장 많이 틀린 15번(3점, 52.4%)은 저항·코일·축전기를 직렬로 연결한 교류 회로, 19번(51.2%)은 정지한 스피커와 움직이는 관찰자의 도플러 효과 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
