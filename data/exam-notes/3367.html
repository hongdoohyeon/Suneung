<h2>2015년 10월 고3 학력평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>윤리와 사상은 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(2점, 49.9%)은 한 사상의 관점에서 퍼즐 낱말을 설명하는 문항, 3번(37.3%)은 동양 사상가가 부정할 질문을 고르는 문항이었습니다.</p>
