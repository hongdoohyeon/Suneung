<h3>30번 96.1%, 50% 넘은 문항 13개</h3>
<p>수학은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 13개였습니다. 가장 많이 틀린 30번(4점, 96.1%)은 세 실수로 정의한 함수 문항, 29번(94.9%)은 예각삼각형 ABC에서 B와 C에서 내린 수선의 발을 다룬 도형 문항, 28번(82.3%)은 수열의 합 조건 문항, 27번(77.7%)은 로그 부등식 문항이었습니다.</p>
