<h3>갑국·을국 조사 20번</h3>
<p>사회·문화는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 20번(3점, 65.6%)은 갑국과 을국이 모든 국민을 대상으로 실시한 조사 자료 문항, 10번(58.3%)은 A~C 지역으로 이루어진 갑국의 자료, 19번(57.7%)은 서로 다른 탐구 태도 (가), (나) 문항이었습니다.</p>
