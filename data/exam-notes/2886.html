<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2018-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 13개</h3>
<p>화학Ⅱ는 오답률 50%를 넘은 문항이 13개로 이 회차 과학탐구에서 가장 많았습니다. 가장 많이 틀린 17번(3점, 70.3%)은 용질 X를 녹인 두 용액의 증기 압력, 20번(65.5%)은 수용액을 가열하며 용질을 더 녹일 때의 끓는점, 18번(63.2%)은 기체 X와 Y의 확산 실험, 7번(62.2%)은 하이드라진의 구조식과 생성 엔탈피 문항이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
