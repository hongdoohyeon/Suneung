<h3>50% 넘은 문항 9개, 30번 86.3%</h3>
<p>수학 A형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 9개였습니다. 가장 많이 틀린 30번(4점, 86.3%)에 이어 27번(81.6%), 29번(79.8%), 28번(79.0%), 26번(71.5%)으로 주관식 후반부 다섯 문항이 모두 70%를 넘었습니다.</p>
