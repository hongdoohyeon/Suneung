<h3>3쌍 대립유전자 가족 19번, 81.2%</h3>
<p>교육청 채점 결과 1등급 구분 표준점수는 69점, 최고점은 76점(677명)이었습니다. EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 8개였습니다.</p>
<p>가장 많이 틀린 19번(3점, 81.2%)은 3쌍의 대립유전자가 결정하는 형질의 가족 문항으로 응답의 41.0%가 한 오답에 몰렸고, 16번(65.4%)은 사람의 세 유전 형질 문항이었습니다.</p>
