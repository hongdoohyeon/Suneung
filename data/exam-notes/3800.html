<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-jun-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>동물 조직 8번, 오답 쏠림 47.0%</h3>
<p>생명과학Ⅰ은 EBSi 추정 1등급 컷이 원점수 42점이었고 오답률 50%를 넘은 문항이 8개였습니다. 가장 많이 틀린 8번(3점, 71.1%)은 동물의 네 조직을 특징에 따라 구분하는 과정 문항으로 응답의 47.0%가 같은 오답(5번)을 골랐습니다.</p>
<p>완두씨의 모양과 색깔 유전 11번(60.0%), 유전병 A의 가계도 19번(57.4%)이 뒤를 이었습니다.</p>
