<h3>고사리의 생활사 17번</h3>
<p>생명과학Ⅱ는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 17번(3점, 48.1%)은 고사리의 생활사, 18번(43.7%)은 멘델 집단의 유전병 A, 10번(37.8%)은 간세포의 알부민 유전자 발현 문항이었습니다. 5번은 갓 태어난 토끼의 갈색 지방 조직을 다뤘습니다.</p>
