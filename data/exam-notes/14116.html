<h3>경어 표현 30번과 역 안내 방송 16번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 30번(2점, 67.6%)은 &#x27;お大事に なさって ください&#x27; 같은 경어 표현이 옳은 문장을 고르는 문항, 16번(64.9%)은 신주쿠행 전철이 들어오니 노란 선 안쪽으로 물러나라는 역 안내 방송의 빈칸, 27번(62.2%)은 &#x27;こと&#x27;와 &#x27;だけ&#x27; 등 공통으로 들어갈 말 문항이었습니다.</p>
