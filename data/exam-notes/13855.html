<h3>50% 넘은 문항 14개</h3>
<p>영어는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 14개였지만 가장 많이 틀린 문항도 67.2%였습니다.</p>
<p>2점짜리 33번(67.2%)은 실수를 관객에게 숨기는 마술과 달리 과학은 실수를 드러낸다는 글의 빈칸, 40번(66.1%)은 요약문 문항, 37번(65.2%)은 캘리포니아 주민들에게 자원봉사자인 척 부탁한 연구를 다룬 순서 배열, 장문 어휘 42번(62.4%)이 뒤를 이었습니다.</p>
