<h3>아이들의 가능성 39번 72.2%</h3>
<p>영어는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 39번(3점, 72.2%)은 아이들이 주변 세계에서 증거를 흡수하며 어떤 가능성이 굳어 간다는 글의 문장 위치 문항, 2점짜리 38번(64.1%)은 거울 속 얼굴이 10분 전과 같을 수 없다는 글의 문장 위치, 32번(61.1%)은 뇌를 도시에 빗대 &#x27;경제가 어디 있느냐&#x27;고 묻는 글의 빈칸 문항이었습니다.</p>
