<h3>만점이어야 1등급, 두 선언 사이 20번</h3>
<p>한국사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었습니다. 오답률 50%를 넘은 문항은 20번(3점, 50.8%) 하나로, 나라의 통일을 다룬 두 선언 사이의 사실을 묻는 문항이었습니다.</p>
<p>15번(43.2%)은 제정 목적을 밝힌 법의 내용, 14번(32.6%)은 법령을 제정한 단체, 16번(31.8%)은 1907년 3월 25일 일본과 맺은 조약 문항이었습니다.</p>
