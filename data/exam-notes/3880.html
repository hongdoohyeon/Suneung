<h3>영릉가 전투 15번</h3>
<p>오답률 50%를 넘은 문항은 15번(3점, 56.1%) 하나였습니다. 독립군이 영릉가 뒷산에서 싸운 전투 등 두 전투를 묻는 문항이었습니다. 12번(44.4%)은 자료를 본 학생들의 대화, 17번(42.6%)은 그래프에 나타난 변화의 배경으로 중화학 공업 육성 등을 고르는 문항, 18번(40.8%)은 닉슨 행정부 시기의 공동 성명 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
