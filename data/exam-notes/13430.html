<h3>물에 잠긴 두 물체 18번</h3>
<p>오답률 50%를 넘은 문항은 18번(3점, 60.5%) 하나였습니다. 물에 일부만 잠긴 물체 A와 다른 물체 B의 부력 문항으로 응답의 39.0%가 같은 오답을 골랐습니다. 9번(40.6%)은 코일이 감긴 유리관 속을 낙하하는 자석, 14번(39.7%)은 실생활에 쓰이는 여러 파동 문항이었습니다.</p>
