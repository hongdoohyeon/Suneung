<h3>구직 이야기의 표현 29번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 29번(2점, 69.6%)은 고등학교를 졸업했지만 아직 일자리를 찾지 못했다는 글의 밑줄 표현, 27번(63.8%)은 &#x27;老师向你说的很有意见&#x27; 같은 틀린 문장을 고르는 문항, 2번(63.8%)은 &#x27;准备&#x27;와 성조 배열이 같은 단어를 고르는 문항이었습니다.</p>
