<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2021-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>1등급 50점, 만점이어야 1등급</h3>
<p>정치와 법은 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 67점이었습니다. 한 문항만 틀려도 1등급을 받기 어려운 매우 쉬운 시험이었고, EBSi 가채점 응답자의 문항별 오답률은 공개되지 않았습니다. 이런 회차는 개념을 정확히 알고 있는지보다 실수를 하지 않는지가 등급을 가르므로, 선지의 주어와 조건을 끝까지 확인하는 습관이 중요합니다.</p>
