<h3>퇴적 구조 9번 오답 쏠림</h3>
<p>지구과학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 12번(3점, 59.8%)은 두 지역의 지질 단면과 화석 문항이었고, 9번(59.1%)은 퇴적 구조와 입자 크기에 따른 침강 속도를 다룬 문항으로 응답의 42.0%가 같은 오답(4번)을 골랐습니다. 18번(57.5%)은 북태평양 표층 해류 A~C와 대기 대순환 문항이었습니다.</p>
