<h3>13세의 스마트폰 절도 17번</h3>
<p>가장 많이 틀린 17번(3점, 67.4%)은 13세 학생이 휴대폰 매장에서 스마트폰을 훔친 사건의 법적 판단으로 응답의 30.3%가 한 오답에 몰렸고, 20번(2점, 50.1%)은 국제 연합의 주요 기관 문항이었습니다. 10번(49.7%)은 수행 평가 답안, 19번(47.2%)은 혼인 관계가 해소되는 유형 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
