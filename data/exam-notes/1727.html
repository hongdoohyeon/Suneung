<h3>두 도시의 날씨 그림 14번</h3>
<p>아랍어는 오답률 50%를 넘은 문항이 15개로 대부분의 문항이 어려웠습니다. 가장 많이 틀린 21번은 대화의 빈칸을, 7번은 문법 형태가 맞는 낱말을, 30번은 글의 내용과 맞지 않는 것을, 14번은 그림과 대화로 두 도시의 현재 날씨를 고르는 문항이었습니다.</p>
<h3>인칭 변화와 주제 어휘</h3>
<p>동사의 인칭 변화와 날씨·장소처럼 자주 나오는 주제 어휘를 함께 익혀 두는 것이 효과적입니다.</p>
