<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2019-mar-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>두 하천 5번, 오답률 50% 넘은 문항 없음</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 45점이었습니다. 가장 많이 틀린 5번(3점, 49.0%)은 하구의 삼각주와 유역의 기후로 두 하천을 비교하는 문항, 11번(47.2%)은 수력·화력·원자력의 발전량 비중, 15번(47.1%)은 종교 차이로 분리 독립을 추진하는 지역 등 지도의 네 지역 문항이었습니다.</p>
