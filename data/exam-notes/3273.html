<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-mar-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 서술형 평가 14번</h3>
<p>사회·문화는 입시기관이 집계한 1등급 구분 원점수가 50점, 표준점수 최고점이 67점으로 만점이어야 1등급이었고, 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 14번(2점, 45.2%)은 사회 변동을 보는 두 관점을 비교한 서술형 답안에서 틀린 부분을 찾는 문항, 10번(40.3%)은 자녀 세대의 계층 문항이었습니다.</p>
