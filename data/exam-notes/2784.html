<h3>오답률 50% 넘은 문항 14개</h3>
<p>화학Ⅱ는 오답률 50%를 넘은 문항이 14개였습니다. 가장 많이 틀린 15번(3점, 65.5%)은 물이 든 실린더에 기체 A를 넣고 압력을 달리한 용해 평형, 18번(2점, 62.8%)은 금속 A, B 전극의 화학 전지, 16번(62.8%)은 기체 반응으로 기체의 성질을 알아보는 실험, 20번(61.1%)은 약산 HA 수용액의 중화 적정 곡선 문항이었습니다.</p>
<p>1등급 구분 원점수는 43점이었습니다.</p>
