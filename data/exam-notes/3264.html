<h3>알루미늄과 금속 이온 18번</h3>
<p>오답률 50%를 넘은 문항은 3개였습니다. 가장 많이 틀린 18번(3점, 62.0%)은 금속 A 이온 4몰이 든 수용액에 알루미늄 1몰을 넣는 산화 환원 실험, 19번(60.5%)은 기체 A와 B가 반응해 C를 만드는 양적 관계, 20번(56.0%)은 HCl·NaOH·KOH 혼합 용액 문항이었습니다.</p>
<p>1등급 구분 원점수는 44점이었습니다.</p>
