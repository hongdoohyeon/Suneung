<h2>2013년 7월 고3 학력평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>윤리와 사상은 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 13번(3점, 35.6%)은 세 서양 사상가가 모두 긍정할 질문, 9번(30.1%)은 조선 시대 두 사상가가 모두 긍정할 질문 문항이었습니다.</p>
