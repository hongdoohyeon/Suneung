<h3>만점이어야 1등급, 군산의 일출·월출 18번</h3>
<p>지구과학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 18번(3점, 35.3%)은 시험 직전인 2015년 10월 5~15일 군산의 일출과 월출 시각 그래프 문항이었습니다.</p>
