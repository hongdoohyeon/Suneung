<h3>역사 동아리 축제 부스 10번</h3>
<p>한국사는 1등급(40점 이상) 비율이 16.15%였고 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 10번(3점, 60.0%) 하나였습니다. 고등학교 축제의 역사 동아리 체험 부스 운영 계획서로 한 단체를 묻는 문항이었습니다.</p>
<p>16번(49.9%)은 고종이 대한 제국의 외교권을 박탈한 조약이 자신의 뜻에 반해 강제로 맺어졌다고 밝힌 을사늑약의 결과를 묻는 문항이었습니다.</p>
