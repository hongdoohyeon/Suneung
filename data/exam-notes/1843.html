<h3>열기관 순환 17번</h3>
<p>물리학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였고 EBSi 추정 1등급 컷은 원점수 44점이었습니다. 가장 많이 틀린 17번(3점, 69.4%)은 이상 기체가 A→B→C→A로 순환하는 압력·부피 그래프, 16번(65.9%)은 용수철에 매단 물체의 탄성 퍼텐셜 에너지, 20번(61.1%)은 마찰 없는 빗면에서 등가속도 운동하는 물체 A 문항이었습니다.</p>
