<h2>2016년 4월 고3 학력평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>윤리와 사상은 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 8번(3점, 44.4%)은 ㉠에 들어갈 내용을 고르는 문항, 3번(42.7%)은 우리의 정신을 사로잡은 우상을 다룬 근대 사상가 등 두 근대 서양 사상가, 12번(37.7%)은 분배 정의의 조건을 다룬 두 사회사상가 문항이었습니다.</p>
