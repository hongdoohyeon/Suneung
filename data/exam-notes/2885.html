<h3>HCl에 NaOH을 넣는 중화 18번</h3>
<p>가장 많이 틀린 18번(3점, 70.8%)은 HCl 20 mL에 NaOH을 더할 때 이온 수 변화, 19번(64.4%)은 HCl에 금속 A를 넣는 산화 환원 실험, 20번(58.9%)은 A 152 g이 든 용기에서 기체 A와 O2가 반응하는 양적 관계, 14번(54.1%)은 수소 원자의 전자 전이 스펙트럼 선 문항이었습니다.</p>
<p>1등급 구분 원점수는 42점이었습니다.</p>
