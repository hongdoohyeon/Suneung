<h2>2016학년도 수능 세계지리 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>세계지리는 표준점수 최고점과 1등급 구분 표준점수가 모두 63점이었고, 만점자가 8.2%에 달했습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 19번(2점, 48.7%)은 여행지 출발지와 도착지의 기후 그래프 문항, 18번(47.1%)은 세계 3대 식량 작물의 대륙별 생산 비중 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>오답률 50%를 넘은 문항이 없는 쉬운 시험이었습니다.</p>
