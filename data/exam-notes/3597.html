<h2>2015년 11월 고2 학력평가 생명과학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-nov-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>질소 순환 14번, 체세포 분열 6번</h3>
<p>생명과학Ⅰ은 EBSi 추정 1등급 컷이 원점수 44점이었고 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 두 문항이 2점짜리였습니다. 14번(69.8%)은 생태계의 질소 순환 과정 표, 6번(68.3%)은 사람의 체세포 분열 과정에서 핵 1개당 DNA 상대량 변화를 다룬 문항이었습니다.</p>
<p>두 유전병의 가계 20번(62.2%)이 뒤를 이었습니다.</p>
