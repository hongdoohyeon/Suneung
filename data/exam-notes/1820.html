<h3>1등급 41점, 어려웠던 정치와 법</h3>
<p>정치와 법은 입시기관이 집계한 1등급 구분 원점수가 41점, 표준점수 최고점이 77점으로 어려웠습니다. EBSi 가채점 응답자 기준으로 가장 많이 틀린 문항은 7번(3점, 78.9%)이었고 오답률 50%를 넘은 문항은 5개였습니다. 정치와 법은 선거 제도·국가 기관·민법 사례처럼 조건을 하나씩 적용해야 하는 문항이 많아, 사례의 시점과 주체를 먼저 표시해 두는 습관이 실수를 줄입니다.</p>
