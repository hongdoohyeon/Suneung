<h2>2016학년도 수능 세계사 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>세계사는 표준점수 최고점과 1등급 구분 표준점수가 모두 64점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 17번(3점, 53.9%)은 유럽 학문 발전을 정리한 자료의 빈칸을 채우는 문항, 14번(45.1%)은 독일의 산둥반도 진출 등 두 시기 사이의 사실을 고르는 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>열강의 중국 분할(조차지)은 국가별로 지역을 지도에 표시해 정리해 두면 효과적입니다.</p>
