<h3>두 운동 19번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 19번(3점, 36.9%)은 두 운동, 12번(34.5%)은 학습 주제의 빈칸, 11번(33.1%)은 두 사건 사이의 사실 문항이었습니다.</p>
