<h2>2017학년도 수능 한국지리 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>한국지리는 표준점수 최고점 65점, 1등급 구분 표준점수 64점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 15번(2점, 79.4%)은 온라인 학습 장면의 답글 가운데 옳은 내용만 고르는 문항, 16번(52.3%)은 권역별 1차 에너지 공급 구조 그래프 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>답글 고르기 문항은 진술 하나하나를 독립적으로 판단해야 하므로, 개념을 정확히 알고 있어야 합니다.</p>
