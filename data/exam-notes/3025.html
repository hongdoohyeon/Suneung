<h2>2016년 10월 고3 학력평가 지구과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2017-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 50% 넘은 문항 없음</h3>
<p>지구과학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(3점, 47.2%)은 태양과 달의 기조력 가운데 하나만 고려한 해수면 변화, 17번(43.2%)은 500 hPa 등압면 고도, 19번(40.9%)은 우리 은하 별들의 회전 속도 곡선 문항이었습니다.</p>
