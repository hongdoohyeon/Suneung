<h3>변압기와 송전선 17번</h3>
<p>오답률 50%를 넘은 문항은 2개였습니다. 가장 많이 틀린 17번(2점, 58.9%)은 변압기와 저항값이 다른 송전선으로 전력을 공급하는 문항, 6번(56.0%)은 경사각이 다른 두 경사면 위 물체의 운동 문항이었습니다. 20번(49.5%)은 실로 연결되어 액체에 잠긴 두 물체, 15번(48.6%)은 태양 전지와 p-n 접합 다이오드 회로 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
