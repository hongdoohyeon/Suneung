<h3>NaOH 용해열 8번</h3>
<p>화학Ⅱ는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 8번(2점, 43.8%)은 수산화 나트륨의 용해열 측정, 17번(40.1%)은 산 HA의 단계별 이온화, 12번(36.5%)은 HA의 중화 적정 문항이었습니다.</p>
