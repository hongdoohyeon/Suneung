<h3>학생 활동지 8번</h3>
<p>정치와 법은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 8개였습니다. 가장 많이 틀린 8번(2점, 63.6%)은 수업 시간 학생 활동지의 A, B 문항, 20번(59.6%)은 전체 의석수 300석인 갑국 의회 자료, 5번(59.3%)은 중앙 선거 관리 위원회와 정당법 조항을 다룬 문항이었습니다.</p>
