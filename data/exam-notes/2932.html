<h3>여행 경로를 기후로 찾는 20번</h3>
<p>가장 많이 틀린 20번(3점, 52.7%)은 출발지·경유지·도착지의 1월과 7월 기후 자료로 여행 경로를 고르는 문항, 17번(52.2%)은 유럽·아시아·아프리카·앵글로아메리카의 연령별 인구 그래프 문항이었습니다. 19번(45.0%)은 합산 점수로 중국 안 공장 입지를 고르는 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
