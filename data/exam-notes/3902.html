<h3>저우언라이와의 안보 논의 성명 18번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 46점이었습니다. 가장 많이 틀린 4번(3점, 41.5%)은 유적으로 문명을 묻는 문항, 18번(40.6%)은 저우언라이 총리와의 안보 논의를 언급한 성명이 나온 배경, 13번(38.5%)은 가상 편지를 쓴 인물이 활동하던 시기의 경제 상황 문항이었습니다.</p>
