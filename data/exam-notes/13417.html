<h3>50% 넘은 문항 12개, 30번 87.9%</h3>
<p>수학 B형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 12개였습니다. 가장 많이 틀린 30번(4점, 87.9%)에 이어 29번(76.0%), 14번(66.9%), 27번(64.2%), 21번(63.8%), 28번(63.7%) 순이었습니다. 객관식 14번이 오답률 3위에 오른 것이 눈에 띕니다.</p>
