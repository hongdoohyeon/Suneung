<h3>세 관측소로 찾는 진앙 1번</h3>
<p>오답률 50%를 넘은 문항은 1번(3점, 51.2%) 하나였습니다. 세 관측소의 자료로 지진의 진앙을 찾는 문항이었습니다. 6번(45.7%)은 광물을 특성에 따라 나눈 벤 다이어그램, 5번(44.2%)은 동해의 중력 이상 문항이었습니다.</p>
<p>1등급 구분 원점수는 43점이었습니다.</p>
