<h3>동학 농민 운동 8번</h3>
<p>한국사는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 3개였습니다. 가장 많이 틀린 8번(3점, 59.6%)은 고부·백산 전투에서 세력을 떨친 &#x27;그들&#x27;을 묻는 문항, 11번(55.6%)은 불교 통합에 힘쓴 지눌이 활동한 국가의 사실을 묻는 문항, 12번(51.3%)은 칠천량 패배 뒤 병선과 무기가 흩어진 상황의 시기를 연표에서 고르는 문항이었습니다.</p>
