<h3>닉슨과 중국 20번</h3>
<p>동아시아사는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 20번(3점, 67.8%)은 닉슨 대통령의 미국·중국 관계 자료 등으로 (가), (나) 시기 사이의 사실을 묻는 문항, 16번(56.4%)은 공공 조계와 프랑스 조계가 표시된 지도의 도시 문항이었습니다.</p>
