<h2>2015년 7월 고3 학력평가 세계사 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>세계사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 11번(3점, 28.5%)은 &#x27;자유는 우리의 것&#x27;이라는 역사 드라마 기획서의 장면, 8번(24.7%)은 농노 해방을 요구한 상황의 배경, 10번(21.8%)은 조슈 번과 사쓰마 번이 세운 새 정부의 정책 문항이었습니다.</p>
