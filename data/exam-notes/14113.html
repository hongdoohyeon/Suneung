<h3>비교 표현 30번과 노트르담 화재 5번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 30번(2점, 78.6%)은 plus que와 plus de, moins de 같은 비교 표현의 쓰임을 판단하는 문항, 29번(71.4%)은 d&#x27;autres의 쓰임 문항이었습니다. 5번(71.4%)은 2019년 4월 노트르담 대성당 화재를 다룬 대화의 빈칸 문항으로, 시험 반년 전의 사건을 소재로 삼았습니다.</p>
