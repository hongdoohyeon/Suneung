<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2018-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>도다이사 대불 11번, 죽림칠현 16번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 11번(3점, 36.2%)은 도다이사 대불 조영을 주도한 인물로 시대를 묻는 문항, 16번(34.8%)은 죽림칠현의 상수가 활동한 시기, 15번(31.3%)은 이슬람 세계의 왕조를 다룬 다큐멘터리, 19번(28.2%)은 사라예보 사건으로 시작된 제1차 세계 대전 문항이었습니다.</p>
