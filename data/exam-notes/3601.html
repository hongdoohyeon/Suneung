<h2>2015학년도 수능 지구과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2015-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>지구과학Ⅱ는 표준점수 최고점 71점, 1등급 구분 표준점수 68점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 13번(3점, 58.4%)은 편광 현미경의 재물대를 돌리며 암석 박편을 관찰한 문항, 17번(55.9%)은 북반구 아열대 해양의 표층 순환 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>편광 현미경 문항은 개방 니콜과 직교 니콜에서의 관찰 결과(다색성·간섭색·소광)를 구분해 정리해 두어야 합니다.</p>
