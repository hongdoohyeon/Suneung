<h2>2013년 6월 고1 학력평가 과학(지구과학 영역) 해설</h2>

<h3>남중한 달 18번 74.8%</h3>
<p>과학 지구과학 영역은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 18번(3점, 74.8%)은 어느 날 서울에서 남중한 달의 모습 문항이었습니다.</p>
<p>질량이 서로 다른 주계열성 A, B, C의 진화 과정 20번(63.6%), 서울에서 보름 간격으로 같은 시각에 관측한 별자리 4번(56.1%)이 뒤를 이어 천문 단원이 상위를 차지했습니다.</p>
