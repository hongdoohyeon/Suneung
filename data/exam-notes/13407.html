<h3>오목 거울 18번, 50% 넘은 문항 6개</h3>
<p>물리학Ⅱ는 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 18번(3점, 59.8%)은 오목 거울과 광축 위의 물체, 11번(54.9%)은 균일한 자기장, 16번(53.9%)은 일정한 진동수의 음원, 4번(53.9%)은 엘리베이터 안의 영희가 관찰한 물체의 운동 문항이었습니다.</p>
