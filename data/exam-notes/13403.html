<h3>1등급 39점, 법적 판단 17번 77.6%</h3>
<p>법과 정치는 입시기관이 집계한 1등급 구분 원점수가 39점으로 매우 어려웠고 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 17번(3점, 77.6%)은 자료의 사례에 대한 법적 판단, 12번(69.6%)은 국무 회의에 참석하는 A~C, 7번(61.6%)은 위헌 법률 심판 등 헌법 재판 문항이었습니다.</p>
