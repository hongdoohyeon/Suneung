<h3>1등급 43점, 국제 수지표 17번</h3>
<p>경제는 입시기관이 집계한 1등급 구분 원점수가 43점, 표준점수 최고점이 83점으로 사회탐구에서 가장 어려웠습니다. 오답률 50%를 넘은 문항은 국제 수지표를 분석하는 17번(3점, 53.9%) 하나였고, 18번(48.3%)은 100만 원을 연 2% 복리로 맡긴 사례, 9번과 4번(각 44.9%)은 임대 주택 시장 변화와 시장 형태 구분 문항이었습니다.</p>
