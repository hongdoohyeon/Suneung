<h3>양적 관계 20번 70.4%</h3>
<p>화학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 20번(3점, 70.4%)은 A(g)와 B(g)가 반응해 C(g)를 만드는 반응의 양적 관계 문항으로 응답의 36.4%가 같은 오답(2번)을 골랐습니다. 13번(62.2%)은 수소 원자의 오비탈 (가)~(다), 19번(60.0%)은 용기 (가), (나)에 든 두 기체의 자료 문항이었습니다.</p>
