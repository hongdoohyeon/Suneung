<h2>2017학년도 수능 화학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>화학Ⅱ는 표준점수 최고점 70점, 1등급 구분 표준점수 66점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 19번(2점, 74.1%)은 열화학 반응식과 평형 상수, 20번(71.7%)은 약산 수용액과 혼합 수용액의 pH, 18번(71.0%)은 기체 반응의 양적 관계 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>완충 용액 문항은 약산과 짝염기의 농도비로 pH를 판단하는 원리를 이해해 두어야 계산이 단순해집니다.</p>
