<h3>토크빌이 본 혁명 6번</h3>
<p>세계사는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 6번(3점, 37.5%)은 토크빌의 기록으로 혁명의 결과를 묻는 문항, 8번(33.1%)은 한 시기 영국의 경제 상황을 알아보는 탐구 활동 문항이었습니다.</p>
