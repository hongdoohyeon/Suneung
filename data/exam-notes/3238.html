<h3>서양 사상가들의 가상 대화 18번, 응답 47%가 한 오답에</h3>
<p>오답률 50%를 넘은 문항은 18번(3점, 67.6%) 하나였습니다. 서양 사상가들의 가상 대화로 두 사람의 입장을 고르는 문항으로, 응답의 46.8%가 같은 오답(5번)을 골랐습니다.</p>
<p>11번(44.2%)은 한 사상적 관점에서 ㉠에 들어갈 내용, 19번(39.0%)은 세 사상가가 서로를 비판하는 내용 문항이었습니다. 1등급 구분 원점수는 44점이었습니다.</p>
