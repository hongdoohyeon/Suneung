<h2>2015년 10월 고3 학력평가 세계지리 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>세계지리는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 7번(2점, 48.5%)은 한 나라를 두고 스무고개를 하는 장면, 15번(43.5%)은 두 제조업의 국가별 생산 비중 문항이었습니다.</p>
