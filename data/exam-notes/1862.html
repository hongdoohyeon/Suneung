<h3>노장 사상 13번</h3>
<p>생활과 윤리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 13번(3점, 62.6%)은 &#x27;있음과 없음은 서로 상대적으로 일어난다&#x27;로 시작하는 (가), (나) 사상의 입장 문항, 15번(62.5%)은 갑, 을 사상가를 그림으로 표현하는 문항, 2점짜리 3번(55.0%)은 의무감에서 비롯된 행위가 옳다는 입장의 ㉠ 문항이었습니다.</p>
