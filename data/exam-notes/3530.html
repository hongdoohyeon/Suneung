<h3>두 사상가를 그림으로 7번</h3>
<p>오답률 50%를 넘은 문항은 7번(3점, 55.4%) 하나였습니다. 두 사상가의 입장을 그림으로 표현하는 문항이었습니다. 20번(43.3%)은 세 사상가의 입장, 4번(31.1%)은 지적 재산권 논증의 소전제에 대한 반론, 3번(28.9%)은 오온(五蘊)을 말한 불교 사상의 입장 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
