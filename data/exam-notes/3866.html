<h3>서술형 답안 9번</h3>
<p>윤리와 사상은 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 9번(2점, 40.7%)은 서술형 답안의 오류 찾기, 15번(40.4%)은 조선 시대 세 사상가, 16번(37.8%)은 고대 서양 사상가들의 가상 대화 문항이었습니다.</p>
