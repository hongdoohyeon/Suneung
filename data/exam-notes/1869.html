<h2>2021년 6월 고2 학력평가 정치와 법 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2021-jun-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>50% 넘은 문항 9개, 국가 기관 견제 11번</h3>
<p>정치와 법은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 9개로 사회탐구 가운데 가장 많았습니다. 가장 많이 틀린 11번(3점, 71.9%)은 우리나라 국가 기관 A~C 사이의 상호 견제 그림 문항, 19번(62.7%)은 고대 아테네 민주 정치와 근대·현대 민주 정치를 A~C로 둔 문항, 10번(60.2%)은 정치 참여 집단 자료 문항이었습니다.</p>
