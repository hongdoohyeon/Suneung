<h3>30번 96.1%, 50% 넘은 문항 12개</h3>
<p>수학은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 12개였고, EBSi 추정 1등급 컷은 원점수 84점이었습니다.</p>
<p>가장 많이 틀린 30번(4점, 96.1%)은 두 자연수로 정의한 함수 문항, 29번(93.7%)은 코사인과 사인 조건을 만족하는 삼각형 ABC의 넓이 문항, 28번(82.4%)은 극한 조건을 만족하는 삼차함수 문항이었습니다.</p>
