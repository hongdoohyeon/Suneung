<h3>최상급 표현 29번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 29번(2점, 81.4%)은 &#x27;la mieux&#x27;, &#x27;plus meilleur&#x27; 같은 비교·최상급 표현 가운데 옳은 것을 고르는 문항, 30번(74.4%)은 빈칸에 들어갈 말을 &lt;보기&gt;에서 골라 차례로 배열하는 문항이었습니다.</p>
