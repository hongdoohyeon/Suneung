<h3>빈곤 통계 11번 75.9%</h3>
<p>사회·문화는 오답률 50%를 넘은 문항이 4개였습니다. 가장 많이 틀린 11번(3점, 75.9%)은 갑국과 을국의 빈곤 상황 통계를 분석하는 문항이었습니다.</p>
<p>부모 세대와 자녀 세대의 계층 이동 자료 20번(61.8%), 사례 속 사회 집단을 다룬 4번(58.5%)이 뒤를 이었고, 4번은 응답의 32.2%가 같은 오답을 골랐습니다.</p>
