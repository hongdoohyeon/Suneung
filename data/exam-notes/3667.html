<h3>통계표 분석 17번, 66.2%</h3>
<p>오답률 50%를 넘은 문항은 17번(3점, 66.2%) 하나였습니다. 표의 수치로 A 등을 분석하는 문항으로 응답의 32.0%가 같은 오답(4번)을 골랐습니다. 6번(32.7%)은 디자이너를 꿈꾼 사람의 사례, 1번(31.3%)은 두 사례에서 공통으로 부각된 사회·문화 현상의 특징 문항이었습니다.</p>
<p>1등급 구분 원점수는 48점이었습니다.</p>
