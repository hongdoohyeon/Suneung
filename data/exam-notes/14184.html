<h3>산행 대화와 조건 표현</h3>
<p>일본어는 산에 다녀온 이야기를 나누는 대화에서 표현이 옳지 않은 것을 고르는 30번, &#x27;머리가 좋다&#x27;와 같이 두 문장에 공통으로 들어갈 말을 고르는 4번, 조건 표현의 쓰임을 판단하는 27번 등이 출제되었습니다.</p>
<h3>～ば·～たら·～と·～なら</h3>
<p>조건 표현(～ば, ～たら, ～と, ～なら)의 쓰임 차이를 예문으로 정리해 두면 좋습니다.</p>
