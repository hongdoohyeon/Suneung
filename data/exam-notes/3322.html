<h2>2016학년도 수능 법과 정치 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>법과 정치는 표준점수 최고점과 1등급 구분 표준점수가 모두 66점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 12번(3점, 50.6%)은 21세 대학생의 계약 사례를 판단하는 문항, 15번(46.4%)은 가족 관계 상황에 대한 법적 판단 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>오답률 50%를 겨우 넘은 문항이 하나뿐인 쉬운 시험이었습니다. 시험 전체 흐름은 이 회차의 회차 해설에 정리했습니다.</p>
