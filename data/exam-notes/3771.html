<h3>국제 수지표 7번</h3>
<p>가장 많이 틀린 7번(2점, 58.4%)은 갑국의 국제 수지표, 17번(52.2%)은 2013년 갑국의 GDP를 서로 다른 측면에서 나타낸 자료로 응답의 34.5%가 한 오답에 몰렸습니다. 8번(46.0%)은 세 사람이 보유한 금융 상품 문항이었습니다.</p>
