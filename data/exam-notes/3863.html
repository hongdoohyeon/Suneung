<h3>서술형 답안 오류 찾기 15번</h3>
<p>생활과 윤리는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 15번(3점, 47.1%)은 서술형 평가 답안에서 틀린 부분을 찾는 문항, 9번(42.6%)은 한 관점에서 퍼즐의 가로 낱말을 설명하는 문항이었습니다.</p>
