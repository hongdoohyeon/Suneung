<h2>2013년 10월 고3 학력평가 화학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>화학Ⅰ은 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 20번(3점, 45.1%)은 HCl과 NaOH 혼합 용액, 13번(40.0%)은 같은 온도·압력에서 두 기체의 부피, 14번(38.3%)은 알라닌의 구조식 문항이었습니다.</p>
