<h2>2015학년도 9월 모의평가 수학 A형 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2015-sept.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>수학 A형은 표준점수 최고점 146점, 1등급 구분 표준점수 136점으로 어려웠습니다. EBSi 가채점 응답자 기준으로 오답률 50%를 넘은 문항이 8개였습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 30번(4점, 94.2%)에 이어 29번(76.5%), 21번(68.2%), 28번(62.3%), 18번(61.1%)이 어려웠습니다.</p>
<h3>복습할 때</h3>
<p>국어가 매우 쉬웠던 이 시험에서는 수학이 사실상 등급을 갈랐습니다.</p>
