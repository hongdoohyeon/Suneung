<h3>한 사상가의 주장 12번</h3>
<p>오답률 50%를 넘은 문항은 12번(3점, 62.4%) 하나였습니다. 한 사상가의 주장으로 옳은 것을 고르는 문항이었습니다. 17번(46.8%)은 중국 도가·도교 사상의 전개 과정, 15번(41.6%)은 고대 중국 사상가의 주장 문항이었습니다.</p>
