<h3>세대 간 이동 20번과 사회 집단 9번</h3>
<p>가장 많이 틀린 20번(3점, 57.6%)은 갑국의 세대 간 이동 표, 9번(56.2%)은 소속감을 기준으로 나눈 사회 집단 A~F 문항이었습니다. 8번(48.0%)은 두 일탈 행동 이론, 13번(44.9%)은 가장 존경받는 대통령으로 꼽히는 인물의 사례 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점, 표준점수 최고점은 73점이었습니다.</p>
