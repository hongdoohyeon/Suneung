<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2022-sept.html#review">이 회차 전체 해설 보기</a></p>
<h3>hỏng과 거절 표현</h3>
<p>베트남어는 오답률 50%를 넘은 문항이 14개였습니다. 가장 많이 틀린 8번은 문장 표현이 옳은 것을, 4번은 오토바이가 &#x27;고장 났다&#x27;는 hỏng을, 21번은 그림 속 인물을 설명한 문장을, 25번은 제안을 거절할 때 쓰는 표현으로 알맞지 않은 것을 고르는 문항이었습니다.</p>
<h3>상태 동사와 제안·거절</h3>
<p>고장·질병처럼 상태를 나타내는 동사와 제안·거절 표현을 예문으로 정리해 두는 것이 효과적입니다.</p>
