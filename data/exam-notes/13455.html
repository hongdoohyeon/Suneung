<p>가장 많이 틀린 19번(3점, 60.1%)은 탄산 칼슘의 열분해 반응에서 양적 관계를 확인하는 실험, 18번(59.5%)은 순차적 이온화 에너지 문항이었습니다. 11번(47.4%)은 묽은 염산에 넣은 금속 A, B, 14번(46.5%)은 탄소 수 6개인 탄화수소 구조식 문항이었습니다.</p>
