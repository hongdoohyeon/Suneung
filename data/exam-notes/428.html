<h3>&#x27;자유는 노예 상태의 반대&#x27; 4번</h3>
<p>교육청 채점 결과 1등급 구분 표준점수는 71점, 최고점은 80점(158명)이었습니다. EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 4번(3점, 73.2%)은 자유를 노예 상태의 반대로 본 사회사상가의 입장으로 응답의 38.1%가 한 오답에 몰렸고, 1번(60.7%)은 한울님의 뜻에 따른 교화를 말한 스승의 가상 대화 문항이었습니다.</p>
