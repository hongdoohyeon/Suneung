<h3>갑·을·병 상호 비판 14번</h3>
<p>생활과 윤리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 14번(3점, 65.1%)은 갑, 을, 병 사상가가 서로에게 제기할 비판을 그림으로 표현하는 문항, 11번(59.1%)은 &#x27;국가는 모든 공동체의 종착점&#x27;이라는 갑과 을의 입장 문항, 19번(58.9%)은 종교적 인간을 다룬 사상가 문항이었습니다.</p>
