<h3>용수철에 매단 물체 20번</h3>
<p>가장 많이 틀린 20번(3점, 61.7%)은 용수철에 매단 물체의 운동, 5번(54.7%)은 높은 곳에서 놓은 충돌구 문항으로 응답의 33.6%가 한 오답에 몰렸습니다. 19번(49.2%)은 단원자 분자 이상 기체의 순환 과정, 15번(49.2%)은 서 있는 영희와 움직이는 관찰자 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
