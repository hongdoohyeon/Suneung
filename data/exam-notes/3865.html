<h3>예루살렘의 두 종교 20번</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 20번(3점, 44.5%)은 여러 종교가 공존하는 예루살렘의 모습으로 두 종교를 묻는 문항, 9번(35.7%)은 세 나라의 인구 특성 문항이었습니다.</p>
