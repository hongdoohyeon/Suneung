<h3>50% 넘은 문항 11개, 가마쿠라 막부 4번</h3>
<p>세계사는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 11개로 화학Ⅰ과 함께 이 회차 탐구에서 가장 많았습니다. 가장 많이 틀린 4번(3점, 64.3%)은 미나모토노 요리토모를 검색한 화면으로 그 막부 시기의 사실을 묻는 문항, 16번(61.5%)은 임황에 황도를 세운 태조의 왕조, 13번(61.5%)은 서강을 정복하고 남월을 멸망시킨 왕조 문항이었습니다.</p>
