<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>사회·문화는 표준점수 최고점과 1등급 구분 표준점수가 모두 66점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 10번(3점, 61.3%)은 자료 분석 문항으로 응답의 41.7%가 한 오답에 몰렸고, 20번(48.8%)은 성인 대상 조사 자료 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>만점이어야 1등급인 회차에서는 자료 분석 문항에서 비율과 실제 수치를 혼동하지 않는 것이 가장 중요합니다.</p>
