<h2>2015년 4월 고3 학력평가 생명과학Ⅱ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>생명과학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 17번(2점, 48.9%)은 암실에 하루 둔 식물의 빛과 CO2 조건별 광합성, 20번(40.0%)은 싹튼 씨앗의 호흡률 측정 장치, 16번(35.3%)은 캘빈 회로 물질의 탄소 수와 인산기 수 문항이었습니다.</p>
