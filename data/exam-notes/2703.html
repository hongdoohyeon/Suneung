<h3>출제 경향</h3>
<p>생명과학Ⅰ은 표준점수 최고점 72점, 1등급 구분 표준점수 67점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 17번(3점, 75.8%)은 사람의 두 유전 형질 문항, 19번(73.0%)은 ABO식 혈액형과 두 형질의 가계도 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>ABO식 혈액형이 다른 형질과 함께 나오면 연관 여부를 먼저 판단해야 가계도를 빠르게 풀 수 있습니다. 시험 전체 흐름은 이 회차의 회차 해설에 정리했습니다.</p>
