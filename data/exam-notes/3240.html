<h3>지역별 환경 문제 16번</h3>
<p>오답률 50%를 넘은 문항은 16번(3점, 57.1%) 하나였습니다. 석유 자원 개발 등 지도의 A~E 지역에서 일어나는 환경 문제로 틀린 것을 고르는 문항이었습니다. 17번(49.8%)은 아프리카의 강수 분포, 18번(44.5%)은 세 주곡 작물의 기원지와 전파 경로로 대표 음식을 고르는 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
