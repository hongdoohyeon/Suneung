<h3>1등급 40점, 다인자 유전 20번</h3>
<p>생명과학Ⅰ은 입시기관이 집계한 1등급 구분 원점수가 40점이었습니다. 가장 많이 틀린 20번(3점, 64.5%)은 세 쌍의 대립 유전자가 결정하는 형질, 16번(61.5%)은 AaBbDd인 두 개체의 자가 교배, 15번(2점, 52.6%)은 생산자의 1년간 총생산량이 쓰인 비율, 13번(51.7%)은 혈당량 조절 중추의 호르몬 분비 경로 문항이었습니다.</p>
