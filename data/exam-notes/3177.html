<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>지구과학Ⅱ는 표준점수 최고점 80점, 1등급 구분 표준점수 71점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 20번(3점, 63.7%)은 어느 지역의 지질도 문항, 17번(63.2%)은 대동누층군과 경상누층군의 분포를 구분하는 한반도 지질 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>한반도의 지질 계통(조선누층군, 평안누층군, 대동누층군, 경상누층군)은 시대와 퇴적 환경을 함께 정리해 두어야 합니다.</p>
