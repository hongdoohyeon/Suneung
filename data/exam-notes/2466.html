<h3>광역시별 서비스업 9번</h3>
<p>가장 많이 틀린 9번(3점, 52.9%)은 숙박 및 음식점업 등 두 서비스업의 광역시별 현황 그래프, 16번(51.4%)은 평년 기후 값으로 네 지역을 구분하는 문항이었습니다.</p>
<p>20번(41.2%)은 ○○광역시의 개발 과정 표, 10번(35.5%)은 도로·철도 등 교통수단의 상대적 특징 문항이었습니다. 1등급 구분 원점수는 48점이었습니다.</p>
