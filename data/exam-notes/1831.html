<h3>30번 98.6%, 추정 1등급 80점</h3>
<p>수학은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 10개였고 EBSi 추정 1등급 컷이 원점수 80점이었습니다. 가장 많이 틀린 30번(4점, 98.6%)은 응답자 거의 전부가 틀렸고, 29번(92.1%)이 뒤를 이었습니다. 28번(85.5%)은 로그로 좌표를 정한 두 점 A, B와 선분 AB 문항, 객관식 21번(81.6%)은 정의역과 공역이 실수 전체인 함수 문항이었습니다.</p>
