<h3>유럽의 공업 지역 19번</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 19번(3점, 44.7%)은 유럽의 주요 공업 지역, 6번(40.9%)은 1월과 7월 적도 수렴대 위치, 12번(37.9%)은 지도의 두 인구 이동 문항이었습니다.</p>
