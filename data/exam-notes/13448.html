<h3>오답률 50% 넘은 문항 없음</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 13번(3점, 38.1%)은 기후 자료로 지역을 찾는 문항, 16번(37.7%)은 공업 지역, 7번(37.5%)은 국가별 1차 에너지 소비량 변화 문항이었습니다.</p>
