<h3>막대 일곱 개의 평형 19번</h3>
<p>가장 많이 틀린 19번(3점, 70.4%)은 길이와 질량이 같은 막대 A~G가 쌓여 평형을 이루는 문항, 20번(69.7%)은 서로 다른 경사면에 놓여 실로 연결된 세 물체, 16번(68.4%)은 단열된 실린더 속 이상 기체 문항으로 응답의 35.8%가 한 오답에 몰렸습니다.</p>
<p>18번(60.7%)은 물통 안에 정지한 두 물체의 밀도와 부력 문항이었습니다. 1등급 구분 원점수는 45점이었습니다.</p>
