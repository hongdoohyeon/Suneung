<h3>두 사상의 &#x27;하늘&#x27; 11번</h3>
<p>생활과 윤리는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 11번(3점, 42.6%)은 두 사상이 하늘(天)을 보는 관점, 3번(41.3%)은 한 사상이 강조하는 수양의 자세, 1번(35.1%)은 &#x27;뼈와 살&#x27;을 나눈 관계를 다룬 인간관계 문항이었습니다.</p>
