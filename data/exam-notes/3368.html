<h2>2015년 10월 고3 학력평가 한국지리 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>한국지리는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 8번(3점, 49.2%)은 세 지역의 계절별 평균 기온, 18번(39.9%)은 동쪽 산간 지역 등 두 지역을 지도에서 고르는 문항이었습니다.</p>
