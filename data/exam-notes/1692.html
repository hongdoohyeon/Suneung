<h3>50% 넘은 문항 10개, 방어 작용 18번</h3>
<p>생명과학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 10개였습니다. 가장 많이 틀린 18번(3점, 69.3%)은 유전적으로 동일한 생쥐로 항원 X에 대한 방어 작용을 알아보는 실험, 16번(61.5%)은 G1기 세포에서 정자가 형성되는 과정, 2점짜리 17번(61.3%)은 3개의 유전자로 결정되는 형질 (가) 문항이었습니다.</p>
