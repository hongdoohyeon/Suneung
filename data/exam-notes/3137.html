<h3>별의 고도 변화 16번</h3>
<p>지구과학Ⅰ은 오답률 50%를 넘은 문항이 16번(3점, 65.3%) 하나였고 1등급 구분 원점수는 46점이었습니다. 북반구에서 어느 별의 시간에 따른 고도 변화를 다룬 문항이었습니다.</p>
<p>18번(47.5%)은 가상의 행성 A, B의 공전 궤도, 17번(45.4%)은 2016년 1월부터 7월까지 매월 1일 세 행성의 위치, 19번(45.2%)은 광학 망원경으로 태양 흑점을 관측하는 방법 문항이었습니다.</p>
