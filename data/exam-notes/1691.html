<h3>50% 넘은 문항 하나, 추정 1등급 47점</h3>
<p>물리학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 20번(3점, 71.1%) 하나였고, EBSi 추정 1등급 컷은 원점수 47점이었습니다. 20번은 원래 길이가 정해진 용수철에 연결된 물체 A에 연직 아래로 힘을 가한 운동 문항이었습니다. 단색광이 입사각 45°로 전반사하는 14번(44.9%), 이상 기체의 상태 변화 8번(44.5%)이 뒤를 이었습니다.</p>
