<h3>반응 계수 20번과 산화 환원 18번</h3>
<p>오답률 50%를 넘은 문항은 3개였지만 상위 두 문항은 70%를 넘었습니다. 가장 많이 틀린 20번(3점, 74.8%)은 A와 B가 반응해 C를 만드는 반응의 계수, 18번(72.1%)은 금속 A~C의 산화 환원 실험, 17번(52.0%)은 HCl·NaOH 혼합 용액에 KOH를 넣는 중화 문항이었습니다.</p>
<p>1등급 구분 원점수는 45점이었습니다.</p>
