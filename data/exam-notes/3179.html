<h2>2017학년도 6월 모의평가 화학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>Ⅰ과목 최고점 76점, 탄화수소 19번이 1위</h3>
<p>화학Ⅰ은 표준점수 최고점이 76점으로 과학탐구 Ⅰ과목 가운데 가장 높았습니다(1등급 구분 68점).</p>
<h3>분자식이 다른 탄화수소 X~Z</h3>
<p>가장 많이 틀린 19번(3점, 72.4%)은 분자식이 다른 탄화수소 X~Z 문항, 20번(69.7%)은 A(g)와 B(g)의 반응 실험 문항이었습니다.</p>
<h3>불포화도부터</h3>
<p>탄화수소 문항은 탄소 수와 수소 수로 불포화도를 먼저 계산하는 것이 출발점입니다.</p>
