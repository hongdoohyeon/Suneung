<h3>1등급 5.85%, 50% 넘은 문항 하나</h3>
<p>세계지리는 교육청 채점 결과 1등급 구분 표준점수는 65점, 최고점은 68점(468명)이었습니다. 1등급 비율이 5.85%였고, EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 17번 하나였습니다.</p>
<p>17번(2점, 51.2%)은 &#x27;탱고와 축구의 나라&#x27;로 소개한 국가를 묻는 문항, 7번(43.3%)은 19세기 내연 기관 발명과 함께 쓰임이 커진 에너지 문항이었습니다.</p>
