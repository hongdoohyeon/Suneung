<h3>오답률 50% 넘은 문항 1개</h3>
<p>지구과학Ⅱ는 EBSi 가채점 응답자 기준으로 오답률 50%를 넘은 문항이 10번(3점, 51.9%) 하나뿐이었고, 19번(48.1%), 20번(44.4%), 8번(44.4%)이 뒤를 이었습니다. 입시기관이 집계한 1등급 구분 원점수는 45점, 표준점수 최고점은 78점이었습니다.</p>
