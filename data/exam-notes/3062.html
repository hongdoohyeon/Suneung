<h3>남반구 온대 저기압 13번</h3>
<p>지구과학Ⅰ은 EBSi 추정 1등급 컷이 원점수 42점이었고 오답률 50%를 넘은 문항이 9개였습니다. 가장 많이 틀린 13번(3점, 65.8%)은 남반구와 북반구 중위도의 온대 저기압을 비교한 문항, 20번(65.2%)은 맑은 날 해안가의 낮과 밤 등압면 분포 문항이었습니다.</p>
<p>제주도 만장굴과 강원도의 동굴을 비교한 6번(58.2%), 친환경 에너지 발전 방식 3번(56.8%)이 뒤를 이었습니다.</p>
