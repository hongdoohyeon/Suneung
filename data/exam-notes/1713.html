<h3>기후 그래프 8번</h3>
<p>세계지리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 3개였습니다. 8번(3점, 62.4%)은 세 지역의 월평균 기온과 강수량 그래프, 15번(60.8%)은 국가명으로 검색한 인터넷 화면, 6번(59.2%)은 산맥의 최고봉 위치 표로 (가)~(라) 산맥을 판단하는 문항이었습니다.</p>
