<h3>전동기가 끄는 물체 19번</h3>
<p>오답률 50%를 넘은 문항은 2개였습니다. 가장 많이 틀린 19번(3점, 55.8%)은 전동기가 실로 연결된 물체 A를 50 N으로 끄는 문항, 14번(53.1%)은 두 빗면에 차례로 놓은 물체 A, B 문항이었습니다. 12번(48.1%)은 자기장 영역을 지나는 도선, 11번(47.6%)은 구리 도선 위에 실로 매단 자석 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
