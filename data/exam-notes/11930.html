<h2>2013년 11월 고2 학력평가 법과 정치 해설</h2>
<p class="exam__body-meta">2026-10-13 작성 · <a href="exam-set-kice-2013-nov-g2.html#review">이 회차 전체 해설 보기</a></p>
<h3>이혼과 친권 13번, 선거 결과 20번</h3>
<p>법과 정치는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 13번(3점, 67.7%)은 혼인해 병과 정을 낳은 갑과 을이 이혼하면서 자녀가 각각 한쪽 부모와 살게 된 사례의 법적 판단 문항으로 응답의 34.0%가 같은 오답을 골랐습니다.</p>
<p>총선 결과 표를 분석하는 20번(67.0%), 소비자 피해 구제 절차 16번(64.6%)이 뒤를 이었습니다.</p>
