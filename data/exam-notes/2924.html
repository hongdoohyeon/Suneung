<h3>방화 사건의 형사 절차 14번</h3>
<p>가장 많이 틀린 14번(2점, 54.4%)은 음식점에 불을 질러 구속·기소된 사건의 형사 절차, 16번(51.6%)은 공동의 적에 맞선 국가들의 동맹 전략 문항이었습니다. 5번(48.5%)은 전형적인 정부 형태를 채택한 나라의 의회 선거 결과, 20번(48.2%)은 16세가 용돈으로 감당할 수 없는 노트북을 산 계약 문항이었습니다.</p>
