<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>생명과학Ⅱ는 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 18번(3점, 49.2%)은 아세틸 CoA 1분자가 TCA 회로를 거치는 과정, 3번(48.7%)은 현미경으로 세포 크기를 재는 실험, 14번(44.7%)은 14CO2로 광합성 산물을 추적하는 실험이었습니다.</p>
