<h3>향촌 인재 선발 4번</h3>
<p>세계사는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 5개였습니다. 가장 많이 틀린 4번(3점, 60.2%)은 향촌의 인재를 선발하는 제도가 시행된 시기의 사실, 15번(57.8%)은 공행이라는 조합을 설치한 왕조의 경제 상황 문항이었습니다.</p>
