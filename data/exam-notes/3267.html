<h3>예금 원리금 6번</h3>
<p>오답률 50%를 넘은 문항은 6번(3점, 53.4%) 하나였습니다. t년과 t+1년의 금리 그림으로 예금 원리금 등을 분석하는 문항으로 응답의 31.7%가 한 오답에 몰렸습니다. 16번(48.9%)은 두 재화만 생산하는 나라의 자료, 20번(48.0%)은 실질 GDP와 명목 GDP, 18번(48.0%)은 우리나라 외환 시장의 변화 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
