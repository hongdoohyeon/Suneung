<h3>만점이어야 1등급, 두 사건 사이 7번</h3>
<p>세계사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었습니다. 오답률 50%를 넘은 문항은 두 사건 사이의 사실을 고르는 7번(3점, 50.7%) 하나였고, 15번(41.7%)은 &#x27;공화정 만세! 국왕 루이 필리프는…&#x27;으로 시작하는 2월 혁명의 영향 문항이었습니다.</p>
