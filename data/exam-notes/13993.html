<h3>고용 지표 10번, 응답 48.5%가 같은 오답</h3>
<p>경제는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 5개였습니다. 가장 많이 틀린 10번(3점, 76.6%)은 갑국의 2019년과 2020년 고용 지표 변화 표를 분석하는 문항으로, 응답의 48.5%가 같은 오답(4번)을 골라 정답을 고른 학생(23.4%)의 두 배를 넘었습니다. 20번(70.2%)은 갑국과 을국의 GDP 추이 표 문항이었습니다.</p>
