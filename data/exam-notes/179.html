<h3>安排와 忙坏了, 5번</h3>
<p>가장 많이 틀린 5번은 &#x27;경기를 마련하다&#x27;(安排)와 &#x27;바빠서 녹초가 되다&#x27;(忙坏了)에 들어갈 말을 고르는 어휘 문항이었습니다. 30번은 대화 속 표현 오류를 찾는 문항, 28번은 지속을 나타내는 着의 쓰임, 27번은 &#x27;중국을 떠난 지 2년이 되었다&#x27;의 어순을 묻는 문항이었습니다.</p>
<h3>동태 조사와 시량 보어</h3>
<p>着·了·过 같은 동태 조사와 시량 보어의 어순은 예문 단위로 정리해 두는 것이 효과적입니다.</p>
