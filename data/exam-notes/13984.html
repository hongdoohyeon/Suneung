<h3>철학 활동 32번 68.4%</h3>
<p>영어는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 10개였고, 가장 많이 틀린 문항도 68.4%로 고르게 어려웠습니다. 2점짜리 32번(68.4%)은 지식을 갈망하는 철학 활동의 바탕을 다룬 빈칸, 34번(67.2%)은 튀긴 음식이 밋밋한 음식보다 맛있게 느껴지는 까닭을 다룬 빈칸, 39번(65.2%)은 페인트나 금속 조각 같은 작은 우주 쓰레기를 다룬 문장 위치 문항이었습니다.</p>
