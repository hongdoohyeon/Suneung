<h3>자연재해 피해액 16번</h3>
<p>가장 많이 틀린 16번(3점, 67.0%)은 세 지역의 자연재해 피해액으로 재해를 구분하는 문항으로 응답의 46.0%가 같은 오답(4번)을 골랐습니다. 2번(65.7%)은 두 지점 간의 지형 단면, 20번(2점, 51.9%)은 지리 정보의 의미와 수집 방법, 9번(51.4%)은 폐광 시설 관광 자원 등 탐구 주제를 고르는 문항이었습니다.</p>
