<h3>세대 간 계층 이동 20번</h3>
<p>사회·문화는 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 20번(3점, 62.1%)은 갑국의 계층 구조와 세대 간 계층 이동 자료를 분석하는 문항이었습니다.</p>
<p>신뢰 경험이 자기 통제력에 미치는 영향을 다룬 연구 11번(59.0%), 1차적 사회화 기관과 재사회화를 다룬 17번(54.2%), 가족·노동조합·회사 내 동호회를 구분하는 3번(53.6%)이 뒤를 이었습니다.</p>
