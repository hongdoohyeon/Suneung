<h3>시적 화자의 정서 30번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 오답률 50%를 넘은 문항은 30번(2점, 51.6%) 하나로, ㉮에 나타난 시적 화자의 정서를 고르는 문항이었습니다. 26번(45.2%)은 ㉠~㉤의 풀이 문항이었습니다.</p>
