<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-mar-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>제2차 세계 대전 패배와 전쟁 14번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 44점이었습니다. 가장 많이 틀린 14번(3점, 45.9%)은 제2차 세계 대전 패배로 경제가 어려웠던 나라를 언급한 글로 시기를 정한 (가) 전쟁 중의 사실, 19번(42.8%)은 동아시아 두 도시, 11번(38.4%)은 &#x27;성(性)은 곧 이(理)&#x27;라는 사상 등 두 사상 문항이었습니다.</p>
