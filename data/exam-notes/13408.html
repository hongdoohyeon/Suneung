<h3>나트륨 관련 반응 17번</h3>
<p>오답률 50%를 넘은 문항은 17번(3점, 66.4%) 하나였습니다. 나트륨과 관련된 몇 가지 반응을 다룬 문항으로 응답의 40.3%가 같은 오답(1번)을 골랐습니다. 12번(48.8%)은 화합물 AB와 CB의 전자 배치, 18번(48.3%)은 프로페인의 연소 문항이었습니다.</p>
