<h3>1등급 73점, 굽타 왕조 14번</h3>
<p>세계사는 교육청 채점 결과 1등급 구분 표준점수는 73점, 최고점은 78점(365명)이었습니다. EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항은 5개였습니다.</p>
<p>가장 많이 틀린 14번(3점, 67.6%)은 찬드라굽타 1세가 세운 왕조를 묻는 문항으로 응답의 45.9%가 같은 오답(1번)을 골랐습니다. 10번(64.9%)은 다큐멘터리 기획안으로 한 제국의 건축과 문화를 묻는 문항이었습니다.</p>
