<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 50% 넘은 문항 없음</h3>
<p>한국사는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 19번(3점, 36.5%)은 새 정권이 확립되기까지 활동한 위원회, 15번(31.1%)은 두 발표 사이의 사실, 17번(30.5%)은 총사령관 지청천의 독립군 문항이었습니다.</p>
