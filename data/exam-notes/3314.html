<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>화학Ⅱ는 표준점수 최고점 68점, 1등급 구분 표준점수 64점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 18번(2점, 70.3%)은 A가 B를 생성하는 반응의 평형 상수 문항, 20번(66.9%)은 반응 속도식 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>평형 상수 문항은 반응 전·변화·평형의 몰수를 표로 정리한 뒤 농도로 바꾸는 순서를 지켜야 합니다.</p>
