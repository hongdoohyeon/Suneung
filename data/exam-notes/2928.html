<h3>세 사상가를 그림으로 6번, 71.5%</h3>
<p>가장 많이 틀린 6번(3점, 71.5%)은 세 사상가의 입장을 그림으로 탐구하는 문항, 9번(56.4%)은 &#x27;먼저 인간이어야 하고 그다음에 국민이어야 한다&#x27;고 한 사상가 등 두 사상가의 시민 불복종 입장, 13번(53.0%)은 인권 침해라고 모두 국제적 무력 사용의 명분이 될 수는 없다는 사상가의 관점을 고르는 문항이었습니다.</p>
<p>1등급 구분 원점수는 41점이었습니다.</p>
