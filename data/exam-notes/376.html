<h3>호텔 대화와 중고 컴퓨터 광고</h3>
<p>아랍어도 오답률 50%를 넘은 문항이 15개였습니다. 23번과 24번은 호텔 직원과 손님의 대화에서 빈칸과 중심 내용(숙소 결정)을, 22번은 중고 컴퓨터 판매 광고에 언급되지 않은 정보를, 7번은 &#x27;내가 갔다&#x27;를 뜻하는 동사의 1인칭 과거형을 고르는 문항이었습니다.</p>
<h3>인칭별 과거형 변화</h3>
<p>동사의 인칭별 과거형 변화와 호텔·쇼핑 같은 상황 대화의 기본 표현을 반복해서 확인하는 것이 가장 효과적입니다.</p>
