<h3>사회 조사 과정 11번과 사회 집단 5번</h3>
<p>가장 많이 틀린 11번(3점, 68.4%)은 사회 조사 과정, 5번(63.2%)은 사회 집단의 범주를 도식화한 그림으로 응답의 52.8%가 같은 오답(2번)을 골랐습니다. 20번(50.2%)은 세대별 중층 대비 상층과 하층의 구성비 그래프 문항이었습니다.</p>
