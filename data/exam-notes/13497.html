<h3>약국을 묻는 대답 19번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 19번(2점, 83.8%)은 &#x27;여기 약국이 어디 있나요?&#x27;라는 물음에 대한 대답으로 알맞지 않은 것을 고르는 문항, 13번(1점, 81.1%)은 전화 통화 대화의 빈칸 문항이었습니다.</p>
