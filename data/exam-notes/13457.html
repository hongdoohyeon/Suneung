<h2>2013년 3월 고3 학력평가 지구과학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2014-mar-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>50% 넘은 문항 7개, 춘분날 행성 위치 17번</h3>
<p>지구과학Ⅰ은 오답률 50%를 넘은 문항이 7개로 과학탐구Ⅰ 가운데 가장 많았습니다. 가장 많이 틀린 17번(3점, 63.5%)은 춘분날 태양·금성·지구·화성의 상대적 위치, 16번(62.9%)은 황도 12궁, 10번(2점, 59.7%)은 망가니즈 단괴 등 두 해양 자원, 2번(58.6%)은 우리나라의 여러 지형 문항이었습니다.</p>
