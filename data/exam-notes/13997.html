<h3>세포 분열 경로 20번</h3>
<p>생명과학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 20번(3점, 70.8%)은 유전자형이 HhTt인 동물(2n=4)의 세포 X가 서로 다른 경로 Ⅰ, Ⅱ를 거쳐 분열하는 문항, 18번(59.7%)은 민말이집 신경 A, B의 흥분 이동, 16번(56.6%)은 항원 X, Y에 대한 생쥐의 방어 작용 실험이었습니다.</p>
