<h3>근대화를 설명하는 두 이론 14번</h3>
<p>가장 많이 틀린 14번(3점, 60.9%)은 근대화를 설명하는 두 이론으로 응답의 38.2%가 한 오답에 몰렸고, 20번(54.2%)은 자녀 세대의 계층 자료 문항이었습니다. 15번(46.8%)은 남성 대비 여성 근로자의 임금 수준 변화 표 문항이었습니다.</p>
