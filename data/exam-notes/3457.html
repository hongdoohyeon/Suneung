<h3>항공기 승무원 사례 7번</h3>
<p>법과 정치는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 7번(3점, 46.7%)은 항공사 승무원이 비행기 안에서 겪은 사례, 11번(41.1%)은 헌법 재판소 결정문, 18번(40.4%)은 국제 연합의 주요 기구 문항이었습니다.</p>
