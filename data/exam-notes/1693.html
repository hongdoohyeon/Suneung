<h3>공전 궤도 이심률 20번</h3>
<p>지구과학Ⅰ은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 8개였습니다. 가장 많이 틀린 20번(3점, 69.5%)은 공전 궤도 이심률이 다른 A, B 시기의 지구 궤도 문항, 15번(62.1%)은 시간에 따른 태양의 반지름과 표면 온도 변화 문항, 12번(56.9%)은 태평양 적도 부근의 표층 수온 편차 문항이었습니다.</p>
