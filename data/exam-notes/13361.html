<h3>두 사상의 자연관 7번</h3>
<p>오답률 50%를 넘은 문항은 7번(3점, 61.5%) 하나였습니다. 두 사상의 자연관을 그림으로 완성하는 문항이었습니다. 2번(43.4%)은 그림 속 두 인물이 가져야 할 자세, 13번(42.2%)은 한 사상의 수양 방법 문항이었습니다.</p>
