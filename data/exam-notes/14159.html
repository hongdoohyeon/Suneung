<h3>축약·경어 표현과 初もうで</h3>
<p>일본어는 조사 등의 쓰임이 옳지 않은 것을 고르는 27번, 축약 표현과 경어 표현이 옳은 문장을 고르는 30번, 새해 첫 참배(初もうで)를 다룬 대화의 4번 등이 출제되었습니다.</p>
<h3>존경어·겸양어와 회화체 축약형</h3>
<p>존경어와 겸양어의 구별, 회화체 축약형(～とく, ～どく)을 예문으로 정리해 두면 좋습니다.</p>
