<h3>세 항만의 수출 품목 17번</h3>
<p>오답률 50%를 넘은 문항은 17번(2점, 55.8%) 하나였습니다. 세 항만의 수출 품목별 비율로 항만을 지도에서 고르는 문항이었습니다. 18번(45.4%)은 하천 세 지점의 수위 변화, 8번(44.7%)은 우리나라 1차 에너지 생산 추이, 11번(42.1%)은 수력·풍력 등 세 발전 방식 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
