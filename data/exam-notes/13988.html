<h3>신·재생 에너지 6번</h3>
<p>한국지리는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 6번(3점, 63.9%)은 주요 신·재생 에너지의 지역별 생산 비율 그래프, 12번(58.3%)은 사진 속 A~C 지형, 16번(57.1%)은 두 지역의 축제 초대장으로 상대적 기후 특성을 비교하는 문항이었습니다.</p>
