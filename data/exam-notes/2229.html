<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2020-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>세계지리는 EBSi 가채점 응답자 기준으로 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 18번(2점, 49.2%)은 피오르 해안 등 지도에 표시된 지형을 설명하는 문항, 17번(46.4%)은 유럽·아시아·앵글로아메리카를 표와 그래프로 연결하는 문항, 9번(46.0%)은 인도·일본·탄자니아를 그래프로 구분하는 문항이었습니다.</p>
<p>1등급 구분 원점수는 46점이었습니다.</p>
