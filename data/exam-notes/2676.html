<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2018-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 형법·군형법 개정안 15번</h3>
<p>법과 정치는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고, 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 15번(3점, 48.9%)은 형법 개정 법률안과 군형법 개정 법률안의 입법 과정 표, 7번(46.4%)은 네 재판의 쟁점과 판결, 9번(43.5%)은 두 회사에서 해고된 두 사람의 구제 절차 문항이었습니다.</p>
