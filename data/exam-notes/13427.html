<h3>선거 결과 분석 20번, 70.3%</h3>
<p>가장 많이 틀린 20번(3점, 70.3%)은 정당별 득표와 의석을 다룬 선거 결과 분석, 19번(2점, 63.2%)은 그 선거에서 시행된 선거구제의 일반적 특징, 1번(56.5%)은 정책 결정 과정 그림 문항이었습니다. 법과 정치는 입시기관이 집계한 1등급 구분 원점수가 44점이었습니다.</p>
