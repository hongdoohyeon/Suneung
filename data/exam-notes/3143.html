<h3>헌법 소원의 유형 4번</h3>
<p>법과 정치는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 46점이었습니다. 가장 많이 틀린 4번(3점, 48.1%)은 헌법 소원의 유형 구분, 7번(47.2%)은 다수 대표제만으로 의회를 구성하던 나라의 선거 제도 변경, 20번(42.2%)은 성과가 낮은 직원을 둘러싼 노동 문제, 8번(41.9%)은 범죄 소년에 대한 처분 문항이었습니다.</p>
