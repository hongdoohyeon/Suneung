<h2>2014년 10월 고3 학력평가 윤리와 사상 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2015-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급</h3>
<p>윤리와 사상은 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었고 오답률 50%를 넘은 문항이 없었습니다. 가장 많이 틀린 3번(2점, 38.9%)은 중세 서양 사상가의 관점, 5번(38.6%)은 동양 사상을 도식화한 그림의 빈칸 문항이었습니다.</p>
