<h2>2016학년도 수능 한국지리 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2016-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>한국지리는 표준점수 최고점과 1등급 구분 표준점수가 모두 64점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 9번(3점, 61.2%)은 네 지역의 기후 특성 그래프로 지역을 고르는 문항으로 응답의 46.5%가 한 오답에 몰렸습니다.</p>
<h3>복습할 때</h3>
<p>기후 그래프는 기온의 연교차와 강수 집중도로 해안·내륙, 남부·북부를 구분하는 순서로 판단하면 효과적입니다.</p>
