<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 18번(3점, 61.5%)은 대기압이 일정한 곳의 단원자 분자 이상 기체 문항, 10번(61.5%)은 x축 방향 전기장 영역의 위치별 전위 그래프 문항이었습니다.</p>
