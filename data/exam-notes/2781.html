<h3>온대 저기압 11번, 응답 47%가 한 오답에</h3>
<p>가장 많이 틀린 11번(3점, 73.6%)은 우리나라를 지나는 온대 저기압의 등온선 분포와 한 지역의 기상 현상 문항으로, 응답의 47.0%가 같은 오답(5번)을 골랐습니다. 19번(62.7%)은 자전축 경사각 177.4° 등 지구형 행성의 물리량 표, 17번(61.7%)은 춘분날 자정에 관측한 두 별 문항이었습니다.</p>
<p>1등급 구분 원점수는 41점이었습니다.</p>
