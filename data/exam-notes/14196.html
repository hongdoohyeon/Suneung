<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2026-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>了와 是……的, 동사 중첩</h3>
<p>중국어는 동태 조사 了의 쓰임이 옳지 않은 문장(他每年去了重庆)을 고르는 29번, 是……的 구문이 옳게 쓰인 문장을 고르는 28번, 동사 중첩의 쓰임을 묻는 30번 등 문법 문항이 출제되었습니다.</p>
<h3>습관적 동작에는 了를 쓰지 않는다</h3>
<p>습관적 동작에는 了를 쓰지 않는다는 점, 是……的 구문과 동사 중첩의 제약을 예문으로 익혀 두는 것이 효과적입니다.</p>
