<h3>&#x27;같다&#x27;와 &#x27;만약&#x27; 26번</h3>
<p>EBSi 가채점 응답자가 적어 문항별 오답률은 참고용입니다. 가장 많이 틀린 26번(2점, 76.9%)은 ㉠과 ㉡의 뜻을 &#x27;같다&#x27;, &#x27;너&#x27;, &#x27;만약&#x27; 가운데서 바르게 짝지은 것을 고르는 문항, 27번(69.2%)은 ㉢에 해당하는 것을 가난 구제·벼슬 하사 등에서 고르는 문항이었습니다.</p>
