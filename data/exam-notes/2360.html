<h3>계절별 강수 특성 7번</h3>
<p>가장 많이 틀린 7번(3점, 52.0%)은 두 시기 네 지역의 강수 특성 그래프, 14번(49.6%)은 지도의 A~F 가운데 두 지역의 공통점을 발표하는 수업 장면, 17번(2점, 49.3%)은 강원도의 두 지표별 상위 5개 지역 지도 문항이었습니다.</p>
<p>4번(46.9%)은 경원선 철도로 이어진 세 지역의 기후 특징 문항이었습니다. 1등급 구분 원점수는 48점이었습니다.</p>
