<h3>고용률과 취업자 수 20번</h3>
<p>경제는 오답률 50%를 넘은 문항이 6개였습니다. 가장 많이 틀린 20번(3점, 63.3%)은 경제 활동 인구가 일정할 때 고용률과 취업자 수의 변화를 분석하는 문항이었습니다.</p>
<p>X재 가격이 급등해 최고 가격제를 도입하려는 갑국 19번(57.8%), 소득 구간별로 다른 세율을 적용하는 조세 10번(54.1%), 역대 최악의 미세 먼지 경보를 다룬 외부 효과 8번(53.2%)이 뒤를 이었습니다.</p>
