<h3>네 국가의 종교 구성 19번</h3>
<p>세계지리는 오답률 50%를 넘은 문항이 5개였지만 가장 높은 문항도 56.8%였습니다. 19번(3점, 56.8%)은 네 국가의 종교별 인구 구성 비율로 불교·이슬람교·크리스트교·힌두교를 구분하는 문항이었습니다.</p>
<p>형성 원인이 다른 세 사막의 특징을 묻는 15번(55.3%), 안정육괴와 고기·신기 조산대를 색칠하는 컬러링 북 활동 9번(54.4%)이 뒤를 이었습니다.</p>
