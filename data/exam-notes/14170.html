<h3>才와 够, 经过와 通过</h3>
<p>중국어는 부사 才의 쓰임이 옳은 문장을 고르는 30번, 够의 쓰임이 옳지 않은 문장을 고르는 29번, 经过와 通过를 구별하는 5번 등이 출제되었습니다.</p>
<h3>비슷한 부사와 혼동 단어</h3>
<p>才·就처럼 의미가 비슷한 부사와 经过·通过처럼 혼동하기 쉬운 단어는 예문으로 쓰임을 구별해 두는 것이 효과적입니다.</p>
