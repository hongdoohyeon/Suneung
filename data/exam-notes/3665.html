<h3>만주 사변 이후 17번</h3>
<p>오답률 50%를 넘은 문항은 17번(3점, 50.2%) 하나였습니다. 만주 사변 이후 일본 제국주의를 다룬 글의 ㉠ 사례를 고르는 문항이었습니다. 7번(42.3%)은 한 역법을 다룬 문항으로 응답의 30.8%가 한 오답에 몰렸습니다.</p>
<p>1등급 구분 원점수는 48점이었습니다.</p>
