<h3>현대 서양 사상가 12번</h3>
<p>윤리와 사상은 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 12번(3점, 46.0%)은 &#x27;훌륭한 사람은…&#x27;으로 시작하는 현대 서양 사상가의 입장, 20번(43.2%)은 윤리적 인간을 다룬 서양 사상가, 10번(40.9%)은 송·명 시대 두 유교 사상가를 그림으로 탐구하는 문항이었습니다.</p>
