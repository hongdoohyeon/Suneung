<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2018-apr-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>오답률 50% 넘은 문항 없음</h3>
<p>지구과학Ⅱ는 오답률 50%를 넘은 문항이 하나도 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 9번(3점, 47.2%)은 화강암과 현무암을 구성하는 광물의 부피비, 11번(45.5%)은 지각 평형을 이룬 지역의 단면, 20번(44.7%)은 습곡·역단층·정단층, 8번(44.0%)은 셰일이 변성된 암석 문항이었습니다.</p>
