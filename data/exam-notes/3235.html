<h3>쑤저우의 번창 4번</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 4번(3점, 46.4%)은 쑤저우의 번창한 모습을 담은 그림으로 시기의 경제 상황을 묻는 문항, 20번(38.1%)은 조계 사진전으로 시기를 묻는 문항, 16번(34.2%)은 우창 봉기로 시작된 신해혁명 문항이었습니다.</p>
