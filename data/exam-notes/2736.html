<h2>2018학년도 9월 모의평가 세계지리 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2018-sept.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>세계지리는 표준점수 최고점 69점, 1등급 구분 표준점수 67점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 19번(2점, 66.2%)은 대륙별 작물 생산량 비중 그래프, 13번(57.6%)은 인종·민족별 국가 인구 그래프 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>작물·인종 분포는 대륙별 비중이 압도적인 항목부터 확정하는 순서로 풀면 빠릅니다. 시험 전체 흐름은 이 회차의 회차 해설에 정리했습니다.</p>
