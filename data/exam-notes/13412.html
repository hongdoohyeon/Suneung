<h3>지구의 열수지 13번</h3>
<p>가장 많이 틀린 13번(3점, 67.0%)은 지구에 도달하는 태양 복사 에너지를 기준으로 한 열수지, 17번(59.1%)은 일정 기간 관측한 화성의 시직경 변화 문항이었습니다. 18번(47.9%)은 소행성과 지구의 근일점·원일점 거리 문항이었습니다.</p>
