<h2>2017학년도 6월 모의평가 세계지리 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2017-june.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>세계지리는 표준점수 최고점 69점, 1등급 구분 표준점수 67점이었고, 오답률 50%를 넘은 문항이 없었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 15번(2점, 49.7%)은 아프리카 두 지역의 월평균 기온과 강수 편차 그래프 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>아프리카 기후는 적도를 중심으로 남북이 대칭을 이루고 계절이 반대라는 점을 기준으로 판단하면 빠릅니다. 시험 전체 흐름은 이 회차의 회차 해설에 정리했습니다.</p>
