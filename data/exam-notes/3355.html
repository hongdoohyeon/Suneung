<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2016-oct-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>만점이어야 1등급, 유전병 X 15번</h3>
<p>생명과학Ⅱ는 입시기관이 집계한 1등급 구분 원점수가 50점으로 만점이어야 1등급이었습니다. 오답률 50%를 넘은 문항은 상염색체 대립 유전자에 의한 유전병 X 문항인 15번(3점, 53.5%) 하나였고, 20번(42.9%)은 유전자 X의 DNA 염기 서열 문항이었습니다.</p>
