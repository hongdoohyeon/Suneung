<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2021-jun-g1.html#review">이 회차 전체 해설 보기</a></p>
<h3>도시화 17번만 50% 넘어</h3>
<p>이 학년이 처음 치른 통합사회는 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 17번(3점, 63.8%) 하나였습니다. 우리나라의 1970년과 2015년 도시화율과 산업별 취업자 현황을 비교해 옳지 않은 것을 고르는 문항으로 응답의 38.9%가 같은 오답(2번)을 골랐습니다. 그다음으로 많이 틀린 7번도 32.9%였습니다.</p>
