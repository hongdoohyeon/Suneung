<h3>積小成大와 두 한자의 풀이</h3>
<p>한문은 글의 내용으로 밑줄 친 인물을 이해하는 22번, 그림의 한자로 만들 수 있는 사자성어(積小成大 등)의 의미를 고르는 9번, 밑줄 친 두 한자의 풀이를 문맥에 맞게 고르는 29번 등이 출제되었습니다.</p>
<h3>음과 뜻이 여럿인 한자</h3>
<p>惡처럼 음과 뜻이 여럿인 한자는 문맥별 풀이를 예문과 함께 정리해 두는 것이 좋습니다.</p>
