<h2>2017년 7월 고3 학력평가 동아시아사 해설</h2>
<p class="exam__body-meta">2026-10-12 작성 · <a href="exam-set-kice-2018-jul-g3.html#review">이 회차 전체 해설 보기</a></p>
<h3>청·일 조약과 경부선 개통</h3>
<p>동아시아사는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 47점이었습니다. 가장 많이 틀린 13번(3점, 42.6%)은 대일본국과 대청국의 조약 등 두 조약 사이의 사실, 12번(40.7%)은 일본이 항복하자 인민이 봉기했다는 선언의 시기, 18번(39.0%)은 경부선이 개통된 무렵의 동아시아, 16번(33.8%)은 쿠릴타이로 대칸에 올라 대도로 천도한 쿠빌라이 문항이었습니다.</p>
