<h3>프래트와 에어리의 지각 평형설 15번</h3>
<p>지구과학Ⅱ는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 15번(3점, 45.9%)은 프래트설과 에어리설을 설명하는 실험, 14번(41.9%)은 암석의 방사성 원소 함량과 발열량, 20번과 19번(각 38.7%)은 지질 시대 생물 과(科)의 수 변화와 자연사 박물관 화석 설명판 문항이었습니다.</p>
