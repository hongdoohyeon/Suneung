<h3>오답률 50% 넘은 문항 9개</h3>
<p>생명과학Ⅰ은 오답률 50%를 넘은 문항이 9개였고 1등급 구분 원점수는 41점이었습니다. 가장 많이 틀린 19번(3점, 70.9%)은 ABO식 혈액형과 두 형질의 가계, 18번(65.1%)은 RrTtYy인 개체를 자가 교배한 자손 1600개체의 표현형 표, 7번(64.5%)은 체세포 분열과 감수 분열 중인 세포의 대립 유전자, 16번(62.3%)은 철수네 가족 다섯 명의 두 형질 문항이었습니다.</p>
