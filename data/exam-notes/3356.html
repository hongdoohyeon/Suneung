<h3>동짓날 태양 고도 15번</h3>
<p>오답률 50%를 넘은 문항은 15번(3점, 66.1%) 하나였습니다. 같은 경도의 두 지역에서 동짓날 태양 고도를 다룬 문항으로 응답의 33.5%가 한 오답에 몰렸습니다. 18번(46.1%)은 2015년 한 해 동안 수성과 목성의 시직경 변화, 13번(43.8%)은 지구 공전 궤도 변화와 중위도 두 지역 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
