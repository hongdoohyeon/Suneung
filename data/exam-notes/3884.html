<h3>전동기가 끄는 두 물체 19번</h3>
<p>물리학Ⅰ은 입시기관이 집계한 1등급 구분 원점수가 43점이었습니다. 가장 많이 틀린 19번(3점, 61.3%)은 줄로 연결된 두 물체를 전동기가 100 N으로 끄는 문항, 17번(60.6%)은 같은 전력을 송전 전압이 다른 두 송전선으로 보내는 문항, 12번(54.3%)은 저항과 축전기를 연결한 교류 회로 실험, 1번(2점, 52.5%)은 태양 전지로 전동기를 돌리는 문항이었습니다.</p>
