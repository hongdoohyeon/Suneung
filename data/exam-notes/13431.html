<h3>위치 에너지 증가 20번</h3>
<p>가장 많이 틀린 20번(3점, 60.4%)은 물체가 이동하는 동안의 중력 퍼텐셜 에너지 변화 문항으로 응답의 42.7%가 같은 오답(5번)을 골랐습니다. 8번(50.0%)은 평면에서 정지한 물체와의 충돌, 11번(44.5%)은 열의 전도 실험을 두고 나눈 대화 문항이었습니다.</p>
