<h3>원소 A, B로 만든 분자 16번</h3>
<p>가장 많이 틀린 16번(3점, 64.5%)은 원소 A와 B로 이루어진 분자 (가)~(다)의 질량비 자료 문항, 19번(59.7%)은 금속 A~C의 산화 환원 반응 실험, 20번(58.2%)은 A(g)와 B(g)가 반응해 C(g)를 만드는 실험, 18번(57.8%)은 HCl, NaOH, KOH을 섞은 용액 문항이었습니다.</p>
<p>오답률 50%를 넘은 문항은 6개, 1등급 구분 원점수는 47점이었습니다.</p>
