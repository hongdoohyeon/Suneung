<h3>천해파 실험 16번과 바너드별 20번</h3>
<p>가장 많이 틀린 16번(3점, 59.9%)은 깊이 2 cm 수조로 천해파를 만드는 실험, 20번(54.7%)은 1950~2002년 바너드별이 천구에서 움직인 각거리와 흡수선, 6번(53.8%)은 현무암질 마그마의 분화 작용, 5번(52.4%)은 아라비아반도 주변의 판 경계 문항이었습니다.</p>
<p>1등급 구분 원점수는 42점이었습니다.</p>
