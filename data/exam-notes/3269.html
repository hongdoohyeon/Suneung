<h3>두 발표 사이 19번</h3>
<p>오답률 50%를 넘은 문항은 19번(3점, 52.1%) 하나였습니다. &#x27;전쟁 상황은 호전되지 않고&#x27;로 시작하는 발표 등 두 발표 사이의 사실을 고르는 문항으로 응답의 31.5%가 한 오답에 몰렸습니다. 16번(43.2%)은 유럽인을 이용해 아시아를 침략한 일본을 비판한 주장의 배경, 14번(32.2%)은 명에서 활동한 서양 선교사 문항이었습니다.</p>
<p>1등급 구분 원점수는 47점이었습니다.</p>
