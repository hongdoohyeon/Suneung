<h3>제조업 출하액 16번</h3>
<p>한국지리는 오답률 50%를 넘은 문항이 없었고 1등급 구분 원점수는 48점이었습니다. 가장 많이 틀린 16번(3점, 42.9%)은 제조업종별 출하액 상위 5개 시·도 비율, 9번(40.7%)은 낙동강 유역 답사 계획, 12번(37.5%)은 영해와 관련된 학습 자료 문항이었습니다.</p>
