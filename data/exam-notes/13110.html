<h2>2015학년도 수능 생명과학Ⅰ 해설</h2>
<p class="exam__body-meta">2026-10-11 작성 · <a href="exam-set-kice-2015-csat.html#review">이 회차 전체 해설 보기</a></p>
<h3>출제 경향</h3>
<p>생명과학Ⅰ은 표준점수 최고점 71점, 1등급 구분 표준점수 67점이었습니다.</p>
<h3>많이 틀린 문항</h3>
<p>가장 많이 틀린 15번(2점, 69.0%)은 면적이 같은 두 지역의 식물 종 자료로 군집을 분석하는 문항으로 응답의 59.3%가 한 오답에 몰렸고, 17번(66.4%)은 식물 P를 자가 교배한 자손 400개체의 유전 문항이었습니다.</p>
<h3>복습할 때</h3>
<p>군집 조사 문항은 밀도·빈도·피도와 중요치의 계산식을 정확히 익혀 두어야 합니다.</p>
