<h3>39번 73.8%, 50% 넘은 문항 7개</h3>
<p>영어 A형은 EBSi 가채점 응답자 기준 오답률 50%를 넘은 문항이 7개였습니다. 가장 많이 틀린 39번(3점, 73.8%)에 이어 35번(71.3%), 34번(67.4%), 2점짜리 33번(64.9%)이 어려웠고, 37번(2점, 60.5%)은 응답의 35.2%가 한 오답에 몰렸습니다.</p>
