<h3>자전거를 세는 종별사 chiếc</h3>
<p>베트남어는 오답률 50%를 넘은 문항이 5개였습니다. 8번은 자전거를 셀 때 쓰는 종별사 chiếc을, 23번은 무엇을 먹을지 묻는 표현을, 15번은 Hà의 가족 소개 글에 언급된 정보를, 9번은 문장 표현의 옳고 그름을 묻는 문항이었습니다.</p>
<h3>사물별 종별사 표</h3>
<p>사물의 종류에 따라 달라지는 종별사(chiếc·quyển·tờ·đôi 등)를 표로 정리해 두면 좋습니다.</p>
