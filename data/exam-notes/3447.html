<h3>광속에 가까운 우주선 5번</h3>
<p>가장 많이 틀린 5번(3점, 62.3%)은 정지한 영희에 대해 광속에 가까운 속력으로 움직이는 관찰자를 다룬 특수 상대성 이론 문항, 11번(55.3%)은 자기장 영역 Ⅰ, Ⅱ를 지나는 도선, 20번(51.8%)은 액체를 가득 채운 용기와 저울로 부력을 재는 문항이었습니다.</p>
