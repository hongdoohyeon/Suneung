name = "kicegg-search"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 같은 도메인 경로 — CSP(connect-src 'self') 수정 없이 호출, 다른 사이트에서 못 씀
[[routes]]
pattern = "kicegg.com/api/*"
zone_name = "kicegg.com"

# 호출 상한 (Cloudflare 데이터센터 단위 — 한국 이용자는 대부분 ICN 한 곳)
# IP당 분당 12회, 전체 분당 20회(=하루 최대 28,800회 ≈ 최악 월 $30)
[[ratelimits]]
name = "PER_IP"
namespace_id = "2701"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "GLOBAL"
namespace_id = "2702"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
head_sampling_rate = 0.05

# 비밀값: npx wrangler secret put TYPESAFE_API_KEY  (코드·저장소에 두지 않는다)

# 자료 오류 제보 저장소 (/api/report) — 읽기: node cloudflare/smart-search/reports.mjs
[[kv_namespaces]]
binding = "REPORTS"
id = "bb6aff29c5214cdb97b006674cf201a1"

# 제보 도배 방지: IP당 분당 4건
[[ratelimits]]
name = "REPORT_IP"
namespace_id = "2703"
simple = { limit = 4, period = 60 }

# 제보 JEV 분류 전체 상한: 분당 10건 (넘으면 분류 없이 저장만)
[[ratelimits]]
name = "REPORT_JEV"
namespace_id = "2704"
simple = { limit = 10, period = 60 }
