# 시험지 만들기 — kicegg.com/paper/* → 맥에서 도는 편집 서버 (kice-normalize paper/server.py)
# 맥 ↔ Cloudflare 는 고정 터널 kicegg-items 의 paper-origin.kicegg.com. 맥이 꺼져 있으면 '점검 중' 화면.
# 요청 한도는 맥 서버가 X-Client-IP로 직접 센다 (Worker ratelimit은 실측상 느슨했다 — 문항 검색과 같음)
name = "kicegg-paper"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "kicegg.com/paper*"
zone_name = "kicegg.com"

[vars]
ORIGIN = "https://paper-origin.kicegg.com"

[observability]
enabled = true
head_sampling_rate = 0.05

# 비밀값: npx wrangler secret put PAPER_KEY  (맥 ~/.config/kicegg/paper-key 와 같은 값)
