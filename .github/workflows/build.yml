name: build

# 데이터/템플릿/스크립트가 바뀌면 CI가 render-site.py 를 돌려 산출물(HTML·OG·
# sitemap·feed·split)을 자동 생성·커밋한다. → 로컬에서 빌드할 필요가 없어짐.
# (생성물 경로는 트리거에서 제외 → 봇 커밋이 워크플로를 재발화하지 않음)
on:
  push:
    branches: [main]
    paths:
      - 'data/exams.json'
      - 'data/gradecuts.json'
      - 'scripts/render-site.py'
      - 'scripts/build-data.py'
      - 'exam.html'
      - 'exam-set.html'
      - 'fonts/**'
      - '*.js'
      - '*.css'
      - 'lib/*.js'
      - 'index.html'
      - 'archive.html'
      - 'gradecut.html'
      - 'admissions.html'
      - 'data/**'
      - 'scripts/version-assets.py'
      - 'previews/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pillow

      # 지금 라이브에 나가 있는 자산 토큰(1단계 커밋에 그대로 찍는다)
      - name: Remember current asset version
        run: echo "OLD_ASSET_VERSION=$(grep -o 'style.css?v=[A-Za-z0-9_-]*' archive.html | head -1 | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Render site
        run: PYTHONUTF8=1 python3 scripts/render-site.py

      # 홈 첫 화면(필터·표·건수)을 헤드리스 크롬으로 실제 사이트 코드를 돌려 index.html 에 미리 그려 넣는다.
      # 모바일 첫 표시 속도용. 실패해도 index.html 을 건드리지 않고 넘어간다(scripts/prerender-home.py).
      - name: Prerender home first screen
        run: PYTHONUTF8=1 python3 scripts/prerender-home.py

      - name: Verify generated data
        run: |
          python3 scripts/regen-exam-splits.py --check
          npm run validate
          node --test scripts/test-search.mjs

      # ── 2단계 배포 (2026-10) ─────────────────────────────────────────
      # Cloudflare 는 ?v=토큰 자산을 1년 캐시한다. 새 토큰과 새 내용이 한 번에 나가면, GitHub Pages 가 배포 직후
      # 잠깐 내주는 옛 파일이 새 토큰 주소에 붙박일 수 있다(10-06 style.css 사고). 그래서
      #   ① 렌더 결과를 옛 토큰 그대로 올리고 → ② 바뀐 자산이 라이브에서 새 내용인지 확인 → ③ 토큰을 바꿔 올린다.
      - name: Commit generated output (1/2, 옛 토큰)
        run: |
          # render-site 가 박는 기본 토큰(예: style.css?v=20260727a)은 CDN 에 아주 옛 내용으로 남아 있다 → 지금 라이브 토큰으로 맞춘다
          test -n "$OLD_ASSET_VERSION" && python3 scripts/version-assets.py --version "$OLD_ASSET_VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "산출물 변경 없음 — 커밋 생략"
          else
            git commit -m "build: render-site.py 산출물 자동 갱신 [skip ci]"
            git push
          fi

      - name: Wait until changed assets are live
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/wait-assets-live.py "${BEFORE:-${{ github.sha }}~1}"

      - name: Version assets (2/2, 새 토큰)
        run: |
          python3 scripts/version-assets.py
          python3 scripts/version-assets.py --check
          git add -A
          if git diff --cached --quiet; then
            echo "토큰 변경 없음 — 커밋 생략"
          else
            git commit -m "build: 자산 버전 토큰 갱신 [skip ci]"
            git push
          fi

      - name: IndexNow 제출 (변경된 페이지)
        run: PYTHONUTF8=1 python3 scripts/indexnow-submit.py || true
