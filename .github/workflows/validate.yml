name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # vanilla JS — node --check 로 syntax 검사 (deps 설치 불요)
      - name: JS syntax check
        run: |
          set -e
          for f in *.js lib/*.js scripts/*.mjs; do
            [ -f "$f" ] || continue
            echo "  check $f"
            node --check "$f"
          done

      # JSON 파일 형식 검증 — 단일 프로세스 일괄 파싱
      # (파일당 python3 spawn 은 split 수천 개 규모에서 CI 타임아웃 유발 → 한 번에 처리)
      - name: JSON files valid
        run: |
          python3 - <<'PY'
          import json, glob, sys
          files = glob.glob('data/**/*.json', recursive=True)
          bad = []
          for f in files:
              try:
                  with open(f, encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              for f, e in bad[:20]:
                  print(f"✗ {f}: {e}")
              sys.exit(1)
          print(f"  ok: {len(files)} JSON files")
          PY

      # exams.json 비즈니스 규칙 (validate-exams.mjs 가 schema + dup 검사)
      - name: exams.json business rules
        run: node scripts/validate-exams.mjs

      # data/exam/{id}.json 단건 split ↔ exams.json 동기화 (exam.js 가 split 우선 fetch)
      - name: exam splits in sync
        run: python3 scripts/regen-exam-splits.py --check

      # HTML 기본 정합성 (깨진 태그 감지) — 파일당 grep spawn(수천 회)은 느린 러너에서
      # 타임아웃 위험이라 단일 python3 프로세스로 일괄 검사.
      - name: HTML smoke
        run: |
          python3 - <<'PY'
          import glob, sys
          files = glob.glob('*.html')
          bad = []
          for f in files:
              with open(f, encoding='utf-8', errors='ignore') as fh:
                  t = fh.read()
              if '</html>' not in t or '<head>' not in t:
                  bad.append(f)
          if bad:
              for f in bad[:20]:
                  print(f"✗ {f}: </html> 또는 <head> 누락")
              sys.exit(1)
          print(f"  ok: {len(files)} HTML files")
          PY
